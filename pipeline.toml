[global]
default_config = "Debug"
default_platform = "x64"
default_target = "googletest"

[bgfx]
default_backend = "dx11"   # dx11 | dx12 | vulkan

[bgfx_shaders]
backends     = ["dx11", "dx12", "vulkan"]
source_root  = "Dia/DiaBgfx/Shaders"
output_root  = "Cluiche/bin/$(AppName)/$(Configuration)/$(Platform)/shaders"
shaderc_path = "External/bgfx/tools/shaderc.exe"

[proto]
proto_dir = "Dia/DiaDebugProtocol/proto"
output_dir = "Dia/DiaDebugProtocol/proto/generated"
language = "cpp"

[targets.googletest]
project = "Cluiche/Tests/GoogleTests/GoogleTests.vcxproj"
stages = ["compile-code", "deploy"]

[targets.googletest.build_deps]
protobuf      = true
bgfx_shaders  = false

[targets.googletest.deploy]
files = [
  { src = "External/Python311/python311.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-window-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-window-d-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-system-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-system-d-3.dll", dest = "$(OutDir)" },
  { src = "Cluiche/Assets/CluicheTest/Global/misc/ApplicationFlow/*.diaapp", dest = "$(OutDir)Data/Manifests/misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/CluicheTest/cluichetest.diagame", dest = "$(OutDir)Data/Manifests/" },
  { src = "Cluiche/Assets/CluicheTest/cluichetest.diaobservation", dest = "$(OutDir)Data/Manifests/" },
  { src = "Cluiche/Assets/Stages/DummyStage/Misc/ApplicationFlow/*", dest = "$(OutDir)Data/stages/DummyStage/Misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/DummyStage/dummy_stage.diastage", dest = "$(OutDir)Data/stages/DummyStage/" },
  { src = "Cluiche/Assets/Stages/RigidBody2DTestStage/Misc/ApplicationFlow/*", dest = "$(OutDir)Data/stages/RigidBody2DTestStage/Misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/RigidBody2DTestStage/rigidbody2d_stage.diastage", dest = "$(OutDir)Data/stages/RigidBody2DTestStage/" },
  { src = "Cluiche/Assets/Stages/EntityTestStage/misc/ApplicationFlow/*", dest = "$(OutDir)Data/stages/EntityTestStage/misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/EntityTestStage/entity_test_stage.diastage", dest = "$(OutDir)Data/stages/EntityTestStage/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/misc/ApplicationFlow/*", dest = "$(OutDir)Data/stages/Animation2DTestStage/misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/animation2d_test_stage.diastage", dest = "$(OutDir)Data/stages/Animation2DTestStage/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/skeleton/*", dest = "$(OutDir)Data/stages/Animation2DTestStage/skeleton/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/clips/*", dest = "$(OutDir)Data/stages/Animation2DTestStage/clips/" }
]

[targets.cluichetest]
project = "Cluiche/CluicheTest/CluicheTest.vcxproj"
stages = ["compile-code", "build-assets", "deploy"]
app_name = "CluicheTest"
catalogue_manifest = "Cluiche/Assets/CluicheTest/assets.catalogue.json"

[targets.cluichetest.build_deps]
protobuf     = true
bgfx_shaders = true

[targets.cluichetest.deploy]
files = [
  { src = "External/SFML/Current-x64/bin/sfml-window-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-window-d-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-system-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-system-d-3.dll", dest = "$(OutDir)" },
  { src = "Dia/DiaUIUltralight/Deploy/*", dest = "$(OutDir)" },
  { src = "Cluiche/Assets/CluicheTest/cluichetest.diagame", dest = "$(OutDir)assets/" },
  { src = "Cluiche/Assets/CluicheTest/cluichetest.diaobservation", dest = "$(OutDir)assets/" },
  { src = "Cluiche/Assets/CluicheTest/Global/misc/ApplicationFlow/cluiche_main.diaapp", dest = "$(OutDir)assets/global/misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/animation2d_test_stage.diastage", dest = "$(OutDir)assets/stages/Animation2DTestStage/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/misc/ApplicationFlow/animation2d_test_stage.diaapp", dest = "$(OutDir)assets/stages/Animation2DTestStage/misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/skeleton/dragon.diarig", dest = "$(OutDir)assets/stages/Animation2DTestStage/skeleton/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/clips/idle_clip.diaclip", dest = "$(OutDir)assets/stages/Animation2DTestStage/clips/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/clips/flap_up_clip.diaclip", dest = "$(OutDir)assets/stages/Animation2DTestStage/clips/" },
  { src = "Cluiche/Assets/Stages/Animation2DTestStage/clips/flap_down_clip.diaclip", dest = "$(OutDir)assets/stages/Animation2DTestStage/clips/" },
  { src = "Cluiche/Assets/Stages/IK2DTestStage/ik2d_test_stage.diastage", dest = "$(OutDir)assets/stages/IK2DTestStage/" },
  { src = "Cluiche/Assets/Stages/IK2DTestStage/misc/ApplicationFlow/ik2d_test_stage.diaapp", dest = "$(OutDir)assets/stages/IK2DTestStage/misc/ApplicationFlow/" },
  { src = "Cluiche/Assets/Stages/IK2DTestStage/skeleton/dragon.diarig", dest = "$(OutDir)assets/stages/IK2DTestStage/skeleton/" },
]

[targets.cluicheeditor]
project = "Cluiche/CluicheEditor/CluicheEditor.vcxproj"
stages = ["compile-code", "build-assets", "deploy"]

[targets.cluicheeditor.build_deps]
protobuf = true
cef_wrapper = true

[targets.cluicheeditor.deploy]
ui_builds = [
  { cwd = "Cluiche/CluicheEditor/UI", cmd = "node node_modules/vite/bin/vite.js build" },
  { cwd = "Dia/DiaApplicationEditor/UI", cmd = "node node_modules/vite/bin/vite.js build" },
  { cwd = "Dia/DiaPipelineEditor/UI", cmd = "node node_modules/vite/bin/vite.js build" }
]
files = [
  { src = "External/CEF/Resources/*",                     dest = "$(OutDir)" },
  { src = "External/CEF/Resources/locales/**",            dest = "$(OutDir)locales/" },
  { src = "External/CEF/bin/$(Configuration)/*",          dest = "$(OutDir)" },
  { src = "Cluiche/CluicheEditor/Data/*",                 dest = "$(OutDir)assets/configs/" },
  { src = "Cluiche/CluicheEditor/UI/dist/*",              dest = "$(OutDir)ui/" },
  { src = "Cluiche/CluicheEditor/UI/dist/assets/*",       dest = "$(OutDir)ui/assets/" },
  { src = "Dia/DiaEditor/Plugin/Assets/**/*",             dest = "$(OutDir)plugins/" },
  { src = "Dia/DiaApplicationEditor/UI/dist/*",           dest = "$(OutDir)plugins/diaapplicationeditor/" },
  { src = "Dia/DiaApplicationEditor/UI/dist/assets/*",    dest = "$(OutDir)plugins/diaapplicationeditor/assets/" },
  { src = "Dia/DiaApplicationEditor/Assets/*",            dest = "$(OutDir)plugins/diaapplicationeditor/" },
  { src = "Dia/DiaAssetRuntimeInspector/UI/*",               dest = "$(OutDir)plugins/assetruntimeinspector/" },
  { src = "Dia/DiaAssetCatalogueEditor/UI/*",              dest = "$(OutDir)plugins/assetcatalogue/" },
  { src = "Dia/DiaBlueprintEditor/UI/*",                 dest = "$(OutDir)plugins/blueprinteditor/" },
  { src = "Dia/DiaSceneEditor/UI/*",                    dest = "$(OutDir)plugins/sceneeditor/" },
  { src = "Dia/DiaPipelineEditor/UI/dist/*",              dest = "$(OutDir)plugins/diapipelineeditor/" },
  { src = "Dia/DiaPipelineEditor/UI/dist/assets/*",       dest = "$(OutDir)plugins/diapipelineeditor/assets/" },
  { src = "Cluiche/Assets/CluicheEditor/*.ico",            dest = "$(OutDir)assets/icons/" },
  { src = "Cluiche/Assets/CluicheEditor/*.bmp",            dest = "$(OutDir)assets/icons/" },
  { src = "Cluiche/Assets/CluicheEditor/*.png",            dest = "$(OutDir)assets/icons/" },
  { src = "Cluiche/Assets/CluicheEditor/cluicheeditor.diaobservation", dest = "$(OutDir)assets/" },
  { src = "Cluiche/bin/DiaUICEF_TestSubprocess/$(Configuration)/x64/DiaUICEF_TestSubprocess.exe", dest = "$(OutDir)cef/" },
  { src = "Cluiche/bin/DiaUICEF_TestSubprocess/$(Configuration)/x64/DiaUICEF_TestSubprocess.pdb", dest = "$(OutDir)cef/" }
]

[targets.diasfml]
project = "Dia/DiaSFML/DiaSFML.vcxproj"
stages = ["compile-code"]
hidden = true

[targets.diasfml.deploy]
files = [
  { src = "External/SFML/Current-x64/bin/sfml-window-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-window-d-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-system-3.dll", dest = "$(OutDir)" },
  { src = "External/SFML/Current-x64/bin/sfml-system-d-3.dll", dest = "$(OutDir)" }
]

[targets.diauiultralight]
project = "Dia/DiaUIUltralight/DiaUIUltralight.vcxproj"
stages = ["compile-code"]
hidden = true

[targets.diauiultralight.deploy]
files = [
  { src = "Dia/DiaUIUltralight/Deploy/*",          dest = "$(OutDir)" },
  { src = "External/Ultralight/resources/*",        dest = "$(OutDir)resources/" }
]
