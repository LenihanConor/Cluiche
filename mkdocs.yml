site_name: Cluiche
site_description: Game development platform built on the Dia engine
site_author: Cluiche Team
docs_dir: docs
site_dir: .mkdocs-site

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - header.autohide
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-\.]+'
  - mermaid2
  - awesome-pages
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enabled: !ENV [MKDOCS_ENABLE_GIT_DATES, true]
  - redirects:
      redirect_maps: {}
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.keys
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: README.md

  # Audience: newcomers, learning the system
  - Learn:
    - Getting Started:
      - Quickstart: reference/getting-started/quickstart.md
      - Building the Project: reference/getting-started/building-the-project.md
      - Common Tasks: reference/getting-started/common-tasks.md
      - Glossary: reference/getting-started/glossary.md
    - Architecture:
      - Overview: reference/architecture/architecture.md
      - Dia Engine: reference/architecture/dia-engine.md
      - Module System: reference/architecture/module-system.md
      - Threading Model: reference/architecture/threading-model.md
      - Frame Lifecycle: reference/architecture/frame-lifecycle.md
      - Asset Journey: reference/architecture/asset-journey.md
      - Level System: reference/architecture/level-system.md
      - Pipeline Guide: reference/architecture/pipeline-guide.md
      - External Dependencies: reference/architecture/external-dependencies.md
      - Diagrams:
        - System Overview: reference/architecture/diagrams/system-overview.md
        - Module Dependencies: reference/architecture/diagrams/module-dependencies.md
        - Phase Execution: reference/architecture/diagrams/phase-execution.md
        - Level Lifecycle: reference/architecture/diagrams/level-lifecycle.md
        - Threading Model: reference/architecture/diagrams/threading-model.md
    - Design:
      - Philosophy: reference/design-rationale/design.md
      - Why Dia: reference/design-rationale/why-dia.md
      - Why Module/Phase/PU: reference/design-rationale/why-module-phase-pu.md
      - Why Type System: reference/design-rationale/why-type-system.md
      - Design Patterns: reference/design-rationale/design-patterns.md
      - Historical Decisions: reference/design-rationale/historical-decisions.md
      - Future Directions: reference/design-rationale/future-directions.md

  # Audience: active developers building features
  - Build:
    - Specs:
      - Overview: specs/README.md
      - Platform: specs/platform/Cluiche.md
      - Applications:
        - Dia (Engine): specs/applications/dia/dia.md
        - CluicheTest (Game): specs/applications/cluichetest/cluichetest.md
        - CluicheEditor: specs/applications/cluicheeditor/cluicheeditor.md
        - GoogleTests: specs/applications/googletests/googletests.md
    - Development:
      - Contributing: reference/development/contributing.md
      - Coding Standards: reference/development/coding-standards.md
      - Visual Studio Guide: reference/development/visual-studio-guide.md
      - Debugging Tips: reference/development/debugging-tips.md
      - Editor UI Authoring: reference/development/editor-ui-authoring.md
      - Game UI Authoring: reference/development/game-ui-authoring.md
      - Documentation Viewer Guide: reference/development/documentation-viewer-guide.md
      - Known Issues: reference/development/known-issues.md
      - Changelog: reference/development/changelog.md
    - Testing:
      - Test Strategy: reference/testing/test.md
      - Unit Testing: reference/testing/unit-testing.md
      - Integration Testing: reference/testing/integration-testing.md
      - Thread Safety Testing: reference/testing/thread-safety-testing.md
      - Performance Testing: reference/testing/performance-testing.md
      - Test Coverage Targets: reference/testing/test-coverage-targets.md
      - Writing Tests Guide: reference/testing/writing-tests-guide.md
      - Google Test Migration: reference/testing/google-test-migration.md

  # Audience: looking something up
  - Reference:
    - Registry:
      - Module Registry: reference/registry/module-registry.md
      - Module Metadata Schema: reference/registry/module-metadata-schema.md
      - Spec Sync Status: reference/registry/spec-sync-status.md
      - File Locations: reference/registry/file-locations.md
      - External Links: reference/registry/external-links.md
    - AI Guides:
      - AI Navigation: reference/ai-guides/AI-README.md
      - Codebase Map: reference/ai-guides/codebase-map.md
      - Entry Points: reference/ai-guides/entry-points.md
      - Dependency Graph: reference/ai-guides/dependency-graph.md
      - Patterns Reference: reference/ai-guides/patterns-reference.md
      - Thread Safety Guide: reference/ai-guides/thread-safety-guide.md
      - System Boundaries: reference/ai-guides/system-boundaries.md
      - Quick Reference: reference/ai-guides/quick-reference.md
    - DiaMaths:
      - Thread Safety: reference/architecture/dia-maths-thread-safety.md
      - Known Issues: reference/architecture/dia-maths-known-issues.md
    - Tags: reference/tags.md

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cluiche
  generator: false

extra_css:
  - stylesheets/extra.css
