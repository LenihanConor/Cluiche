    sec.appendChild(banner);
  } else if (!s.tooLarge && banner) {
    banner.parentNode.removeChild(banner);
    banner = null;
  }
  if (banner) banner.textContent = s.tooLargeText || 'Selection too large to outline';
}

// ── Query box (DiaCellLayers Query, viewer card) ──────────────────────────
// State "query" (CellLayerViewerDomain): {available, check?{expr, ok, count | error{message,column,length,suggestion?}}, last?{same, from query_run}}.
// The panel bridge is fire-and-forget (no reply), so the page sends panel commands query_check {e} (debounced) / query_run {e} and renders the outcome
// the domain pushes back in state. A check outcome is shown only while its expr equals the input (stale guard). Args are capped at 63 chars by the
// bridge, hence the short key "e"; a longer expression (up to 512 chars) is sent as query_part {i,s} chunks followed by query_check / query_run {n: partCount}.
// The input text and the recent list are page-session state (ui.*), not persisted.
var QUERY_DEBOUNCE_MS = 250;
var QUERY_MAX_RECENT = 10;

var QUERY_MAX_CHARS = 512;

function queryTooLong(text) { return String(text).length > QUERY_MAX_CHARS; }

// Splits text into chunks so every JSON.stringify({i:k,s:chunk}) fits the bridge cap; never splits a surrogate pair. null if it cannot fit.
function queryParts(text) {
  var parts = [], pos = 0;
  while (pos < text.length) {
    var best = pos;
    for (var j = pos + 1; j <= text.length; ++j) {
      if (j < text.length) {
        var hi = text.charCodeAt(j - 1), lo = text.charCodeAt(j);
        if (hi >= 0xD800 && hi <= 0xDBFF && lo >= 0xDC00 && lo <= 0xDFFF) continue;
      }
      if (JSON.stringify({ i: parts.length, s: text.substring(pos, j) }).length > MAX_ARG_JSON) break;
      best = j;
    }
    if (best === pos) return null;
    parts.push(text.substring(pos, best));
    pos = best;
  }
  return parts;
}

function sendQueryCommand(sec, cmd, text) {
  if (JSON.stringify({ e: text }).length <= MAX_ARG_JSON) { sendCommand(sec._cmdId, cmd, { e: text }); return; }
  var parts = queryParts(text);
  if (!parts) return;
  for (var k = 0; k < parts.length; ++k) sendCommand(sec._cmdId, 'query_part', { i: k, s: parts[k] });
  sendCommand(sec._cmdId, cmd, { n: parts.length });
}

function scheduleQueryCheck(sec) {
  clearTimeout(ui.queryTimer);
  ui.queryTimer = null;
  var text = ui.queryText;
  if (!String(text).trim() || queryTooLong(text)) return;
  ui.queryTimer = setTimeout(function () {
    ui.queryTimer = null;
    if (ui.queryText === text) sendQueryCommand(sec, 'query_check', text);
  }, QUERY_DEBOUNCE_MS);
}

function runQuery(sec) {
  var text = ui.queryText;
  if (!String(text).trim()) return;
  clearTimeout(ui.queryTimer);
  ui.queryTimer = null;
  if (queryTooLong(text)) { refreshQueryBox(sec); return; }
  sendQueryCommand(sec, 'query_run', text);
  var r = ui.queryRecent;
  for (var i = r.length - 1; i >= 0; --i) if (r[i] === text) r.splice(i, 1);
  r.unshift(text);
  if (r.length > QUERY_MAX_RECENT) r.length = QUERY_MAX_RECENT;
  refreshQueryBox(sec);
}

function setQueryText(sec, text) {
  var input = sec.querySelector('[data-role="query-input"]');
  ui.queryText = text;
  if (input) input.value = text;
  scheduleQueryCheck(sec);
  refreshQueryBox(sec);
}

function buildQuerySection(cmdId, q) {
  var sec = el('div', 'query-field');
  sec.setAttribute('data-role', 'query');
  sec._cmdId = cmdId;
  sec._q = q;
  var row = el('div', 'query-row');
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'query-input';
  input.placeholder = 'Query, e.g. temp > 3 and biome == water';
  input.setAttribute('data-role', 'query-input');
  input.value = ui.queryText || '';
  input.addEventListener('click', function (e) { e.stopPropagation(); });
  input.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') runQuery(sec);
  });
  input.addEventListener('input', function () {
    ui.queryText = input.value;
    scheduleQueryCheck(sec);
    refreshQueryBox(sec);
  });
  row.appendChild(input);
  var run = el('button', 'query-run', 'Run');
  run.setAttribute('type', 'button');
  run.setAttribute('data-role', 'query-run');
  run.addEventListener('click', function (e) { e.stopPropagation(); runQuery(sec); });
  row.appendChild(run);
  sec.appendChild(row);
  var res = el('div', 'query-result', '');
  res.setAttribute('data-role', 'query-result');
  sec.appendChild(res);
  var errHost = el('div', '', '');
  errHost.setAttribute('data-role', 'query-error-host');
  sec.appendChild(errHost);
  var rec = el('div', 'query-recent', '');
  rec.setAttribute('data-role', 'query-recent');
  sec.appendChild(rec);
  refreshQueryBox(sec);
  return sec;
}

function refreshQuery(root, v) {
  var sec = root.querySelector('[data-role="query"]');
  if (!sec || !v.query) return;
  sec._q = v.query;
  refreshQueryBox(sec);
}

function queryEntryFor(q, text) {
  if (!q) return null;
  if (q.check && q.check.expr === text) return q.check;
  if (q.last && q.last.expr === text) return q.last;
  return null;
}

function refreshQueryBox(sec) {
  var text = ui.queryText || '';
  var res = sec.querySelector('[data-role="query-result"]');
  var errHost = sec.querySelector('[data-role="query-error-host"]');
  var rec = sec.querySelector('[data-role="query-recent"]');
  var resText = '', errInfo = null;
  if (String(text).trim()) {
    if (queryTooLong(text)) {
      errInfo = { message: 'query too long (max ' + QUERY_MAX_CHARS + ' characters)', column: 0, length: 0 };
    } else {
      var entry = queryEntryFor(sec._q, text);
      if (entry && entry.ok) resText = '→ ' + entry.count + (entry.count === 1 ? ' cell matches' : ' cells match');
      else if (entry && entry.error) errInfo = entry.error;
    }
  }
  if (res.textContent !== resText) res.textContent = resText;
  var errSig = errInfo ? JSON.stringify([text, errInfo]) : '';
  if (errHost._sig !== errSig) {
    errHost._sig = errSig;
    while (errHost.firstChild) errHost.removeChild(errHost.firstChild);
    if (errInfo) {
      var box = el('div', 'query-error', '');
      box.setAttribute('data-role', 'query-error');
      box.appendChild(el('div', 'q-msg', errInfo.message || 'invalid query'));
      var col = Number(errInfo.column) || 0, len = Number(errInfo.length) || 0;
      var qt = el('div', 'q-text', '');
      if (len > 0 && col < text.length) {
        qt.appendChild(document.createTextNode(text.substring(0, col)));
        qt.appendChild(el('mark', 'q-span', text.substring(col, col + len)));
        qt.appendChild(document.createTextNode(text.substring(col + len)));
      } else {
        qt.appendChild(document.createTextNode(text));
      }
      box.appendChild(qt);
      if (errInfo.suggestion) {
        var sg = el('button', 'q-suggest', 'did you mean \'' + errInfo.suggestion + '\'?');
        sg.setAttribute('type', 'button');
        sg.setAttribute('data-role', 'query-suggest');
        sg.addEventListener('click', function (e) {
          e.stopPropagation();
          setQueryText(sec, text.substring(0, col) + errInfo.suggestion + text.substring(col + len));
        });
        box.appendChild(sg);
      }
      errHost.appendChild(box);
    }
  }
  var rsig = ui.queryRecent.join('\n');
  if (rec._sig !== rsig) {
    rec._sig = rsig;
    while (rec.firstChild) rec.removeChild(rec.firstChild);
    if (ui.queryRecent.length > 0) {
      rec.appendChild(el('div', 'q-recent-title', 'Recent'));
      for (var i = 0; i < ui.queryRecent.length; ++i) {
        (function (t) {
          var it = el('div', 'q-recent-item', t);
          it.setAttribute('title', t);
          it.addEventListener('click', function (e) { e.stopPropagation(); setQueryText(sec, t); });
          rec.appendChild(it);
        })(ui.queryRecent[i]);
      }
    }
  }
}

// ── Selection Inspector card (Feature 4) ──────────────────────────────────
// State "inspector" (InspectorModel::BuildCardJson, built from the domain's cache): hasSelection, updating, expandedGroups[], base,
// layers[{id,schemaKey,label,unit,tooltip,kind,group,rangeMin?,rangeMax?,count,nanCount,min,mean,max,categories?,other?,
// a?{..}|{notFrozen}|{notComputed}, delta?{count,min,mean,max}}], histogram{bins[16],minRange,maxRange,valid,outOfRangeLow,
// outOfRangeHigh,count,nanCount} | {categories,other,nanCount}, pinned{count,frozen}, cell{index,q,r,rows[],details[]}.
// The page only renders it and sends commands: select_pin {freeze?}, select_unpin {}, inspector_expand {group, expanded}.

function inspNum(x) {
  if (x === null || x === undefined || !isFinite(Number(x))) return '–';
  var n = Number(x);
  if (n === Math.floor(n)) return String(n);
  return String(Number(n.toPrecision(5)));
}

function inspExact(x) {
  if (x === null || x === undefined || !isFinite(Number(x))) return '–';
  return String(Number(Number(x).toPrecision(7)));
}

function inspDelta(x) {
  if (x === null || x === undefined || !isFinite(Number(x))) return ['–', 'd-zero'];
  var n = Number(x);
  if (n === 0) return ['0', 'd-zero'];
  return [(n > 0 ? '+' : '−') + inspNum(Math.abs(n)), n > 0 ? 'd-pos' : 'd-neg'];
}

function inspCell(tr, text, cls) {
  var td = el('td', cls || '', text);
  tr.appendChild(td);
  return td;
}

function inspRangeBar(l) {
  var bar = el('span', 'range-bar');
  var lo = Number(l.rangeMin), hi = Number(l.rangeMax);
  if (l.rangeMin === undefined || l.rangeMax === undefined || !(hi > lo) || l.min === null || l.min === undefined) return bar;
  var pos = function (v) { return Math.max(0, Math.min(100, (Number(v) - lo) / (hi - lo) * 100)); };
  var a = pos(l.min), b = pos(l.max);
  var span = el('span', 'span');
  span.style.left = a + '%';
  span.style.width = Math.max(1, b - a) + '%';
  bar.appendChild(span);
  var mean = el('span', 'mean');
  mean.style.left = pos(l.mean) + '%';
  bar.appendChild(mean);
  return bar;
}

function inspCategoryChips(title, o, role) {
  var box = el('div', 'biome-counts');
  if (role) box.setAttribute('data-role', role);
  if (title) box.appendChild(el('div', 'biome-counts-title', title));
  var cats = Array.isArray(o.categories) ? o.categories : [];
  for (var i = 0; i < cats.length; ++i) {
    if (!(cats[i].count > 0)) continue;
    var chip = el('span', 'biome-chip', (cats[i].label || cats[i].id) + ': ' + cats[i].count);
    chip.setAttribute('data-category', cats[i].id);
    box.appendChild(chip);
  }
  if (o.other > 0) box.appendChild(el('span', 'biome-chip', 'Other: ' + o.other));
  if (o.nanCount > 0) box.appendChild(el('span', 'biome-chip', 'NaN: ' + o.nanCount));
  return box;
}

function inspStatsTable(layers, pinned, frozen) {
  var wrap = el('div', 'insp-scroll');
  var table = el('table', 'stats-table');
  var head = el('tr');
  var cols = ['Layer', 'Count', 'Min', 'Mean', 'Max', 'Unit'];
  var hcls = ['', '', '', '', '', ''];
  if (!pinned) { cols.push(''); hcls.push(''); }   // range bar column; the compare columns need the width instead
  if (pinned) {
    var sub = ['n', 'min', 'mean', 'max'];
    for (var s = 0; s < sub.length; ++s) { cols.push('A ' + sub[s]); hcls.push('cmp-a'); }
    for (var d = 0; d < sub.length; ++d) { cols.push('Δ ' + sub[d]); hcls.push('cmp-d'); }
  }
  for (var c = 0; c < cols.length; ++c) {
    var th = el('th', hcls[c], cols[c]);
    if (pinned && c === 6 && frozen) { var fb = el('span', 'frozen-badge', 'frozen'); fb.setAttribute('data-role', 'frozen-badge'); th.appendChild(fb); }
    head.appendChild(th);
  }
  var thead = el('thead');
  thead.appendChild(head);
  table.appendChild(thead);
  var tbody = el('tbody');
  for (var i = 0; i < layers.length; ++i) {
    var l = layers[i];
    var tr = el('tr');
    tr.setAttribute('data-layer', l.id);
    var name = inspCell(tr, l.label || l.id);
    if (l.tooltip) name.title = l.tooltip;
    if (l.kind === 'category') {
      var cc = el('td');
      cc.setAttribute('colspan', String(cols.length - 1));
      var chips = inspCategoryChips(null, l);
      chips.insertBefore(el('span', 'biome-chip', 'n: ' + l.count), chips.firstChild);
      cc.appendChild(chips);
      tr.appendChild(cc);
      tbody.appendChild(tr);
      continue;
    }
    inspCell(tr, inspNum(l.count), 'num');
    inspCell(tr, inspNum(l.min), 'num');
    inspCell(tr, inspNum(l.mean), 'num');
    inspCell(tr, inspNum(l.max), 'num');
    inspCell(tr, l.unit || '', 'unit');
    if (!pinned) {
      var barCell = el('td');
      barCell.appendChild(inspRangeBar(l));
      tr.appendChild(barCell);
    }
    if (pinned) {
      var a = l.a || {};
      if (a.notFrozen || a.notComputed) {
        var nf = inspCell(tr, a.notFrozen ? 'not frozen' : 'not computed', 'nf');
        nf.setAttribute('colspan', '8');
        if (a.notFrozen) nf.setAttribute('data-role', 'not-frozen');
      } else {
        inspCell(tr, inspNum(a.count), 'num');
        inspCell(tr, inspNum(a.min), 'num');
        inspCell(tr, inspNum(a.mean), 'num');
        inspCell(tr, inspNum(a.max), 'num');
        var dl = l.delta || {};
        var keys = ['count', 'min', 'mean', 'max'];
        for (var k = 0; k < keys.length; ++k) {
          var dv = inspDelta(dl[keys[k]]);
          var dtd = inspCell(tr, dv[0], 'num ' + dv[1]);
          if (k > 0 && l.unit && dv[0] !== '–') dtd.title = l.unit;
        }
      }
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function inspHistogram(insp, baseLabel) {
  var h = insp.histogram;
  var box = el('div', 'insp-histogram');
  box.setAttribute('data-role', 'histogram');
  if (!h) return box;
  if (Array.isArray(h.bins)) {
    box.appendChild(el('div', 'insp-histogram-title', 'Histogram: ' + baseLabel));
    var hist = el('div', 'histogram');
    var maxBin = 0;
    for (var i = 0; i < h.bins.length; ++i) maxBin = Math.max(maxBin, h.bins[i]);
    var span = Number(h.maxRange) - Number(h.minRange);
    for (var b = 0; b < h.bins.length; ++b) {
      var bar = el('div', 'histogram-bar');
      bar.style.height = (maxBin > 0 ? (h.bins[b] / maxBin * 100) : 0) + '%';
      bar.title = (h.valid ? inspNum(Number(h.minRange) + span * b / h.bins.length) + ' – ' + inspNum(Number(h.minRange) + span * (b + 1) / h.bins.length) + ': ' : '') + h.bins[b];
      hist.appendChild(bar);
    }
    box.appendChild(hist);
    var foot = el('div', 'histogram-foot');
    foot.appendChild(el('span', '', h.valid ? inspNum(h.minRange) : ''));
    if (h.outOfRangeLow > 0 || h.outOfRangeHigh > 0) {
      var oor = el('span', 'oor', 'out of range: ' + h.outOfRangeLow + ' low, ' + h.outOfRangeHigh + ' high');
      oor.setAttribute('data-role', 'histogram-oor');
      foot.appendChild(oor);
    }
    foot.appendChild(el('span', '', h.valid ? inspNum(h.maxRange) : ''));
    box.appendChild(foot);
  } else {
    box.appendChild(inspCategoryChips(baseLabel + ' counts:', h, 'histogram-categories'));
  }
  return box;
}

function inspCellSection(cell) {
  var sec = el('div', 'insp-cell');
  sec.setAttribute('data-role', 'inspector-cell');
  sec.appendChild(el('div', 'insp-cell-title', 'Cell (' + cell.q + ', ' + cell.r + ')  #' + cell.index));
  var table = el('table', 'stats-table');
  var rows = Array.isArray(cell.rows) ? cell.rows : [];
  for (var i = 0; i < rows.length; ++i) {
    var r = rows[i];
    var tr = el('tr');
    tr.setAttribute('data-layer', r.layer);
    inspCell(tr, r.label || r.layer);
    var text;
    if (!r.hasData) text = 'no data';
    else if (r.isNaN) text = 'NaN';
    else if (r.kind === 'category') text = r.otherValue ? 'other (' + inspExact(r.value) + ')' : (r.enumLabel || r.enumId || inspExact(r.value));
    else text = inspExact(r.value);
    inspCell(tr, text, 'num');
    inspCell(tr, r.kind === 'category' ? '' : (r.unit || ''), 'unit');
    table.appendChild(tr);
  }
  var details = Array.isArray(cell.details) ? cell.details : [];
  for (var d = 0; d < details.length; ++d) {
    var dr = details[d];
    var dtr = el('tr');
    if (dr.kind === 'section') {
      dtr.className = 'insp-details-section';
      var st = inspCell(dtr, dr.label);
      st.setAttribute('colspan', '3');
    } else if (dr.kind === 'value') {
      var lt = inspCell(dtr, dr.label || dr.schemaKey);
      if (dr.tooltip) lt.title = dr.tooltip;
      inspCell(dtr, dr.value === undefined ? '–' : inspExact(dr.value), 'num');
      inspCell(dtr, dr.unit || '', 'unit');
    } else {
      inspCell(dtr, dr.label);
      var tt = inspCell(dtr, dr.text);
      tt.setAttribute('colspan', '2');
    }
    table.appendChild(dtr);
  }
  if (cell.detailsTruncated) {
    var trn = el('tr');
    var tc = inspCell(trn, 'more details not shown', 'nf');
    tc.setAttribute('colspan', '3');
    table.appendChild(trn);
  }
  sec.appendChild(table);
  return sec;
}

function renderInspector(host, insp, v, cmdId) {
  host.innerHTML = '';
  var title = el('div', 'insp-title', 'Selection inspector');
  var mark = el('span', 'insp-updating', 'updating');
  mark.setAttribute('data-role', 'inspector-updating');
  mark.style.display = insp.updating ? '' : 'none';
  title.appendChild(mark);
  host.appendChild(title);

  var pinRow = el('div', 'pin-buttons');
  pinRow.setAttribute('data-role', 'inspector-pin-row');
  var defs = [['pin', 'Pin as A', 'select_pin', {}], ['freeze', 'Pin + freeze', 'select_pin', { freeze: true }], ['unpin', 'Unpin', 'select_unpin', {}]];
  for (var i = 0; i < defs.length; ++i) {
    var b = el('button', 'pin-btn', defs[i][1]);
    b.setAttribute('type', 'button');
    b.setAttribute('data-role', 'inspector-' + defs[i][0]);
    if (defs[i][0] === 'unpin' ? !insp.pinned : !insp.hasSelection) b.setAttribute('disabled', 'disabled');
    (function (cmd, args) {
      b.addEventListener('click', function (e) { e.stopPropagation(); if (!this.hasAttribute('disabled')) sendCommand(cmdId, cmd, args); });
    })(defs[i][2], defs[i][3]);
    pinRow.appendChild(b);
  }
  host.appendChild(pinRow);
  if (insp.pinned) {
    var chip = el('div', 'pinned-chip', 'A: ' + insp.pinned.count + (insp.pinned.count === 1 ? ' cell' : ' cells') + (insp.pinned.frozen ? '' : ' (live)'));
    chip.setAttribute('data-role', 'inspector-pinned');
    if (insp.pinned.frozen) {
      var fb = el('span', 'frozen-badge', 'frozen');
      fb.setAttribute('data-role', 'frozen-badge');
      chip.appendChild(fb);
    }
    host.appendChild(chip);
  }

  if (!insp.hasSelection) {
    var empty = el('div', 'insp-empty', 'Select cells to inspect');
    empty.setAttribute('data-role', 'inspector-empty');
    host.appendChild(empty);
    return;
  }

  var byId = {};
  var layers = Array.isArray(insp.layers) ? insp.layers : [];
  for (var li = 0; li < layers.length; ++li) byId[layers[li].id] = layers[li];
  var expanded = Array.isArray(insp.expandedGroups) ? insp.expandedGroups : [];
  var groups = Array.isArray(v.groups) ? v.groups : [];
  var baseLabel = insp.base || '';
  for (var bl = 0; bl < layers.length; ++bl) if (layers[bl].schemaKey === insp.base) baseLabel = layers[bl].label || layers[bl].id;
  var frozen = !!(insp.pinned && insp.pinned.frozen);
  for (var g = 0; g < groups.length; ++g) {
    var name = groups[g].name;
    var open = expanded.indexOf(name) >= 0;
    var grp = el('div', 'insp-group');
    grp.setAttribute('data-group', name);
    var gh = el('div', 'insp-group-header');
    gh.setAttribute('data-role', 'inspector-group-header');
    gh.setAttribute('aria-expanded', open ? 'true' : 'false');
    gh.appendChild(el('span', 'caret', open ? '▾' : '▸'));
    gh.appendChild(document.createTextNode(name || 'Layers'));
    (function (n, o) {
      gh.addEventListener('click', function (e) { e.stopPropagation(); sendCommand(cmdId, 'inspector_expand', { group: n, expanded: !o }); });
    })(name, open);
    grp.appendChild(gh);
    var rows = [];
    var ids = groups[g].layers || [];
    for (var k = 0; k < ids.length; ++k) {
      var row = byId[ids[k]];
      // The active base is always shown, even when its group is collapsed.
      if (row && (open || row.schemaKey === insp.base)) rows.push(row);
    }
    if (rows.length > 0) grp.appendChild(inspStatsTable(rows, !!insp.pinned, frozen));
    host.appendChild(grp);
  }
  host.appendChild(inspHistogram(insp, baseLabel));
  if (insp.cell) host.appendChild(inspCellSection(insp.cell));
}

function refreshInspector(root, v) {
  var host = root.querySelector('[data-role="inspector"]');
  if (!host || !v.inspector) return;
  var insp = v.inspector;
  // Re-render only when the content changed; the "updating" mark is flipped in place.
  var copy = {};
  for (var key in insp) if (key !== 'updating') copy[key] = insp[key];
  var k = JSON.stringify([copy, v.groups]);
  if (host._key !== k) { host._key = k; renderInspector(host, insp, v, host._cmdId); }
  var mark = host.querySelector('[data-role="inspector-updating"]');
  if (mark) mark.style.display = insp.updating ? '' : 'none';
}

function buildViewer(domain) {
  var v = domain.viewer;
  var cmdId = domain.cmdId;
  var root = el('div', 'cl-viewer');
  root.setAttribute('data-role', 'cell-layer-viewer');

  if (v.empty) root.appendChild(el('div', 'cl-empty', 'No cell layers registered'));

  if (Array.isArray(v.gridSelector) && v.gridSelector.length > 1) {
    var grids = el('div', 'cl-grids');
    grids.setAttribute('data-role', 'grid-selector');
    for (var g = 0; g < v.gridSelector.length; ++g) {
      var gs = v.gridSelector[g];
      var gb = el('button', 'tool-btn', 'Grid ' + gs.index + ': ' + gs.width + '×' + gs.height);
      gb.setAttribute('type', 'button');
      gb.setAttribute('data-grid', String(gs.index));
      (function (index) {
        gb.addEventListener('click', function (e) { e.stopPropagation(); sendCommand(cmdId, 'grid', { index: index }); });
      })(gs.index);
      grids.appendChild(gb);
    }
    root.appendChild(grids);
  }

  if (v.selection) root.appendChild(buildSelectionSection(cmdId, v.selection));
  if (v.query && v.query.available) root.appendChild(buildQuerySection(cmdId, v.query));
  if (v.inspector) {
    var insp = el('div', 'cl-inspector');
    insp.setAttribute('data-role', 'inspector');
    insp._cmdId = cmdId;
    root.appendChild(insp);
    refreshInspector(root, v);
  }

  if (!v.empty) {
    var search = el('div', 'layer-search');
    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Search layers...';
    input.value = ui.layerFilter || '';
    input.addEventListener('input', function () {
      ui.layerFilter = input.value;
      applyLayerFilter(root);
    });
    search.appendChild(input);
    root.appendChild(search);

    var byId = {};
    for (var i = 0; i < v.layers.length; ++i) byId[v.layers[i].id] = v.layers[i];
    var groups = Array.isArray(v.groups) ? v.groups : [];
    for (var gi = 0; gi < groups.length; ++gi) {
      var grp = el('div', 'layer-group');
      grp.setAttribute('data-group', groups[gi].name);
      grp.appendChild(el('div', 'layer-group-header', groups[gi].name || 'Layers'));
      var ids = groups[gi].layers || [];
      for (var k = 0; k < ids.length; ++k) {
        if (byId[ids[k]]) grp.appendChild(buildLayerItem(cmdId, byId[ids[k]]));
      }
      root.appendChild(grp);
    }
  }

  if (v.overlays.length > 0) {
    var og = el('div', 'layer-group');
    og.setAttribute('data-group', 'Overlays');
    og.appendChild(el('div', 'layer-group-header', 'Overlays'));
    for (var oi = 0; oi < v.overlays.length; ++oi) og.appendChild(buildOverlayItem(cmdId, v.overlays[oi]));
    root.appendChild(og);
  }

  var legend = el('div', 'cl-legend');
  legend.setAttribute('data-role', 'legend');
  root.appendChild(legend);
  var hover = el('div', 'cl-hover');
  hover.setAttribute('data-role', 'hover');
  root.appendChild(hover);

  applyLayerFilter(root);
  return root;
}

function buildLayerItem(cmdId, l) {
  var item = el('div', 'layer-item');
  item.setAttribute('data-layer', l.id);
  item.setAttribute('data-search', (String(l.label) + ' ' + String(l.id)).toLowerCase());
  item.appendChild(el('span', 'layer-radio' + (l.selected ? ' active' : '')));
  item.appendChild(el('span', 'layer-num', l.groupNumber > 0 ? String(l.groupNumber) : ''));
  item.appendChild(el('span', 'layer-label', l.label));
  if (l.description) item.appendChild(vtBuildEntryIcon({ key: l.id, label: l.label, description: l.description, unit: l.unit }));
  if (l.hotkey) item.appendChild(el('span', 'layer-hotkey', l.hotkey));
  item.addEventListener('click', function (e) {
    e.stopPropagation();
    sendCommand(cmdId, 'base', { id: l.id });
  });
  return item;
}

function buildOverlayItem(cmdId, o) {
  var item = el('div', 'layer-item');
  item.setAttribute('data-overlay', o.id);
  item.appendChild(el('span', 'layer-checkbox' + (o.enabled ? ' checked' : '')));
  item.appendChild(el('span', 'layer-label', o.label));
  item.addEventListener('click', function (e) {
    e.stopPropagation();
    sendCommand(cmdId, 'toggle', { drawer: o.id });
  });
  return item;
}

function applyLayerFilter(root) {
  var q = String(ui.layerFilter || '').toLowerCase();
  var groups = root.querySelectorAll('.layer-group');
  for (var g = 0; g < groups.length; ++g) {
    var items = groups[g].querySelectorAll('.layer-item[data-layer]');
    var visible = 0;
    for (var i = 0; i < items.length; ++i) {
      var show = q === '' || (items[i].getAttribute('data-search') || '').indexOf(q) >= 0;
      items[i].style.display = show ? '' : 'none';
      if (show) ++visible;
    }
    if (items.length > 0) groups[g].style.display = visible > 0 ? '' : 'none';
  }
}

function refreshViewer(card, v) {
  var root = card.querySelector('[data-role="cell-layer-viewer"]');
  if (!root) return;

  var activeLabel = v.activeBase;
  for (var i = 0; i < v.layers.length; ++i) {
    var l = v.layers[i];
    var item = root.querySelector('.layer-item[data-layer="' + cssEscape(l.id) + '"]');
    if (item) {
      var radio = item.querySelector('.layer-radio');
      if (radio) radio.classList.toggle('active', !!l.selected);
    }
    if (l.selected) activeLabel = l.label;
  }
  for (var o = 0; o < v.overlays.length; ++o) {
    var oi = root.querySelector('.layer-item[data-overlay="' + cssEscape(v.overlays[o].id) + '"]');
    var cb = oi ? oi.querySelector('.layer-checkbox') : null;
    if (cb) cb.classList.toggle('checked', !!v.overlays[o].enabled);
  }
  if (Array.isArray(v.gridSelector)) {
    for (var g = 0; g < v.gridSelector.length; ++g) {
      var gb = root.querySelector('[data-grid="' + cssEscape(String(v.gridSelector[g].index)) + '"]');
      if (gb) gb.classList.toggle('active', !!v.gridSelector[g].active);
    }
  }

  if (v.selection) refreshSelection(root, v.selection);
  refreshInspector(root, v);
  refreshQuery(root, v);

  var noData = !!v.noData;   // source not live and no data: say so instead of a stale legend / hover
  var legendHost = root.querySelector('[data-role="legend"]');
  var nd = root.querySelector('[data-role="nodata"]');
  if (noData && !nd && legendHost) {
    nd = el('div', 'cl-nodata', 'No data in this view');
    nd.setAttribute('data-role', 'nodata');
    legendHost.parentNode.insertBefore(nd, legendHost);
  } else if (!noData && nd) {
    nd.parentNode.removeChild(nd);
  }
  if (legendHost) {
    var lkey = JSON.stringify([activeLabel, noData ? null : (v.legend || null)]);
    if (legendHost._key !== lkey) { legendHost._key = lkey; renderViewerLegend(legendHost, noData ? null : v.legend, activeLabel); }
  }
  var hoverHost = root.querySelector('[data-role="hover"]');
  if (hoverHost) {
    var hkey = JSON.stringify(noData ? null : (v.hover || null));
    if (hoverHost._key !== hkey) { hoverHost._key = hkey; renderViewerHover(hoverHost, noData ? null : v.hover); }
  }
}

function renderViewerLegend(host, legend, title) {
  host.innerHTML = '';
  if (!legend || !legend.available) return;
  var hdr = el('div', 'card-header', 'LEGEND: ' + String(title).toUpperCase());
  hdr.setAttribute('data-role', 'legend-title');
  host.appendChild(hdr);

  var strip = el('div', 'legend-strip');
  if (legend.category) {
    var sw = Array.isArray(legend.swatches) ? legend.swatches : [];
    for (var i = 0; i < sw.length; ++i) {
      var row = el('div', 'legend-swatch');
      var box = el('span', 'legend-swatch-box');
      box.style.background = viewerRgb(sw[i].rgba);
      row.appendChild(box);
      row.appendChild(el('span', 'legend-swatch-label', sw[i].label || sw[i].id));
      strip.appendChild(row);
    }
  } else {
    var ramp = el('div', 'legend-ramp');
    var stops = Array.isArray(legend.stops) ? legend.stops : [];
    var css = [];
    for (var s = 0; s < stops.length; ++s) css.push(viewerRgb(stops[s].rgba) + ' ' + (stops[s].t * 100) + '%');
    if (css.length === 1) css.push(css[0]);
    if (css.length > 0) ramp.style.background = 'linear-gradient(to right, ' + css.join(', ') + ')';
    strip.appendChild(ramp);
    var labels = el('div', 'legend-labels');
    var ticks = Array.isArray(legend.ticks) ? legend.ticks : [];
    for (var t = 0; t < ticks.length; ++t) labels.appendChild(el('span', '', formatStatValue(ticks[t])));
    strip.appendChild(labels);
    if (legend.unit) strip.appendChild(el('div', 'legend-unit', legend.unit));
    if (legend.seen) {
      strip.appendChild(el('div', 'legend-range',
        'seen in view: ' + formatStatValue(legend.seen.min) + ' – ' + formatStatValue(legend.seen.max)));
    }
  }
  host.appendChild(strip);
}

function renderViewerHover(host, hover) {
  host.innerHTML = '';
  if (!hover || !hover.valid) return;
  host.appendChild(el('div', 'cl-hover-cell', 'cell (' + hover.q + ', ' + hover.r + ')'));
  host.appendChild(el('div', 'cl-hover-value', hover.text));
  host.appendChild(renderValueTooltip(
    { key: hover.layer, label: hover.label, description: hover.description, unit: hover.unit },
    { inspector: false }));
}

// ── Refresh (structure unchanged — update text + classes only) ────────────

function refresh(domains) {
  for (var i = 0; i < domains.length; ++i) {
    var domain = domains[i];
    var card = document.querySelector('.domain[data-domain="' + cssEscape(domain.id) + '"]');
    if (!card) continue;

    if (domain.custom === 'f2_test_runner') {
      var hl = card.querySelector('[data-role="headline"]');
      if (hl) hl.textContent = headlineStat(domain);
      refreshF2Panel(card, domain.raw);
      continue;
    }

    var enabled = isDomainEnabled(domain);
    card.classList.toggle('enabled',  enabled);
    card.classList.toggle('disabled', !enabled);

    var tog = card.querySelector('.tog');
    if (tog) {
      tog.classList.toggle('on',  enabled);
      tog.classList.toggle('off', !enabled);
    }

    var headline = card.querySelector('[data-role="headline"]');
    if (headline) headline.textContent = headlineStat(domain);

    if (domain.viewer) refreshViewer(card, domain.viewer);
    if (domain.history) refreshHistory(card, domain.history);

    for (var d = 0; d < domain.drawers.length; ++d) {
      var dw = domain.drawers[d];
      if (!dw || !dw.name) continue;
      var row = card.querySelector('.dr[data-drawer="' + cssEscape(dw.name) + '"]');
      if (!row) continue;
      row.classList.toggle('on',  !!dw.enabled);
      row.classList.toggle('off', !dw.enabled);
    }

    var statsEl = card.querySelector('[data-role="stats"]');
    if (statsEl) renderStats(statsEl, domain.stats);

    for (var c = 0; c < domain.controls.length; ++c) {
      var def = domain.controls[c];
      if (!def || !controlId(def) || def.value === undefined) continue;
      var ctrl = card.querySelector('.ctrl[data-control="' + cssEscape(controlId(def)) + '"]');
      if (!ctrl) continue;
      var range = ctrl.querySelector('input[type=range]');
      if (!range || range === ui.activeSlider) continue;
      range.value = def.value;
      var cv = ctrl.querySelector('.cv');
      var dec = ctrl.getAttribute('data-decimals');
      if (cv) cv.textContent = formatValue(def.value, dec === null ? null : parseInt(dec, 10));
    }
  }
}

function renderStats(container, stats) {
  var html = '';
  for (var k in stats) {
    if (!Object.prototype.hasOwnProperty.call(stats, k)) continue;
    var v = stats[k];
    if (Array.isArray(v)) {
      if (v.length > 0 && v[0] !== null && typeof v[0] === 'object')
        html += renderArrayTable(v);
    } else if (v !== null && typeof v === 'object') {
      for (var sk in v) {
        if (!Object.prototype.hasOwnProperty.call(v, sk)) continue;
        var sv = v[sk];
        if (sv !== null && typeof sv === 'object') continue;
        html += '<span class="s">' + escapeHtml(k + '.' + sk) +
                ' <span class="v">' + escapeHtml(formatStatValue(sv)) + '</span></span>';
      }
    } else {
      html += '<span class="s">' + escapeHtml(k) +
              ' <span class="v">' + escapeHtml(formatStatValue(v)) + '</span></span>';
    }
  }
  if (container.innerHTML !== html) container.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function cssEscape(s) {
  return String(s).replace(/["\\]/g, '\\$&');
}

// ── Bulk toggles ─────────────────────────────────────────────────────────

function setDomainAll(domainId, target) {
  var domain = null;
  var all = domainsOf(latest);
  for (var i = 0; i < all.length; ++i) { if (all[i].id === domainId) { domain = all[i]; break; } }
  if (!domain) return;

  for (var d = 0; d < domain.drawers.length; ++d) {
    var dw = domain.drawers[d];
    if (!dw || !dw.name) continue;
    if (!!dw.enabled !== target) sendCommand(domain.cmdId, 'toggle', { drawer: dw.name });
  }
}

function setGroupAll(groupKey, target) {
  var all = domainsOf(latest);
  for (var i = 0; i < all.length; ++i) {
    if (all[i].group === groupKey) setDomainAll(all[i].id, target);
  }
}

// ── C++ -> JS entry point ────────────────────────────────────────────────
// CallJSFunction evaluates `updateDomainState(<json>)`, so the argument
// arrives as a live object. A JSON string is also accepted for robustness.
function updateDomainState(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  if (!data || typeof data !== 'object') return;

  latest = data;
  vsScan(data);
  var domains = domainsOf(data);
  var sig = structureSignature(domains);

  if (sig !== ui.structureSig) {
    ui.structureSig = sig;
    rebuild(domains);
  }
  refresh(domains);
  applyHistoryToViewer(domains);
}
window.updateDomainState = updateDomainState;

// ── Phase 2 state ────────────────────────────────────────────────────────
var currentFilter  = '';
var lockedEntityId = '';

// ── JS → C++ log bridge ───────────────────────────────────────────────────
// Relayed to DIA_LOG_INFO("DebugPanelJS",...) via VisualDebuggerModule on
// the Sim PU (~1 frame delay). Max payload: 54 chars.
function jsLog(msg) {
  var s = String(msg);
  if (s.length > 54) s = s.substring(0, 54);
  sendCommand('__log__', 'info', { msg: s });
}

function pushUIOnlyMode() {
  jsLog('pushUIOnlyMode called');
  if (typeof app !== 'undefined' && app && app.PushInputMode) {
    app.PushInputMode('ui_only');
    jsLog('PushInputMode ok');
  } else {
    jsLog('PushInputMode: app not ready');
  }
}
function popInputMode() {
  jsLog('popInputMode called');
  if (typeof app !== 'undefined' && app && app.PopInputMode) app.PopInputMode();
}

// ── Search filter ─────────────────────────────────────────────────────────
function applyFilter(filter) {
  currentFilter = (filter || '').trim().toLowerCase();
  var logVal = currentFilter.length > 30 ? currentFilter.substring(0, 30) : currentFilter;
  jsLog('applyFilter: "' + logVal + '"');
  var list = document.getElementById('groups-list');
  if (!list) return;
  var groups = list.querySelectorAll('.group');
  for (var g = 0; g < groups.length; ++g) {
    var group  = groups[g];
    var doms   = group.querySelectorAll('.domain');
    if (!currentFilter) {
      group.classList.remove('hidden');
      for (var d = 0; d < doms.length; ++d) doms[d].classList.remove('hidden');
      continue;
    }
    var lbl        = group.querySelector('.group-label');
    var groupMatch = !!(lbl && lbl.textContent.toLowerCase().indexOf(currentFilter) !== -1);
    var anyVisible = false;
    for (var d = 0; d < doms.length; ++d) {
      var name = (doms[d].getAttribute('data-domain') || '').toLowerCase();
      var vis  = groupMatch || name.indexOf(currentFilter) !== -1;
      doms[d].classList.toggle('hidden', !vis);
      if (vis) anyVisible = true;
    }
    group.classList.toggle('hidden', !groupMatch && !anyVisible);
  }
}

(function () {
  var s = document.getElementById('search-input');
  if (!s) return;
  s.addEventListener('input', function () {
    jsLog('search input event: "' + s.value.substring(0, 20) + '"');
    applyFilter(s.value);
  });
})();

// ── Entity lock ───────────────────────────────────────────────────────────
function onLockClick() {
  var input = document.getElementById('entity-lock-input');
  if (!input) return;
  var id = input.value.trim();
  if (!id) return;
  lockedEntityId = id;
  updateEntityLockUI();
  sendCommand('__panel__', 'lockEntity', { id: id });
}

function onUnlockClick() {
  lockedEntityId = '';
  var input = document.getElementById('entity-lock-input');
  if (input) input.value = '';
  updateEntityLockUI();
  sendCommand('__panel__', 'lockEntity', { id: '' });
}

function updateEntityLockUI() {
  var btnLock   = document.getElementById('btn-lock');
  var btnUnlock = document.getElementById('btn-unlock');
  if (!btnLock || !btnUnlock) return;

  btnLock.style.display   = locked ? 'none' : '';
  btnUnlock.style.display = locked ? ''     : 'none';

// ── Console (panel-console; contract in DebugPanelPage.h) ─────────────────
// JS -> C++: app.onConsoleLine(seq, p0..p3), app.onConsoleComplete(token),
// app.onConsoleHistory("prev"|"next"). Every string arg is <= 63 chars, so
// the line is sent as up to 4 chunks of 60. C++ -> JS: consoleResult,
// appendLogLines, consoleCompletions, consoleSetInput (JSON string or object).
var CON_MAX_LINE  = 240;
var CON_CHUNK     = 60;
var CON_LOG_CAP   = 500;
var conSeq        = 0;
var conPending    = 0;     // seq awaiting consoleResult (0 = none)
var conPendingTxt = '';
var conDraft      = '';
var conHistActive = false;
var conAc         = [];
var conAcSel      = 0;
var conAcTimer    = null;
var conLogFilter  = 'ALL';
var conLogLines   = [];    // {t, level, channel, msg}

function conEl(id) { return document.getElementById(id); }
function conApp(name) { return typeof app !== 'undefined' && app && app[name]; }
function conEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function conParse(data) {
  if (typeof data === 'string') {
    try { return JSON.parse(data); } catch (e) { return null; }
  }
  return (data && typeof data === 'object') ? data : null;
}
function conPad(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
function conStamp(t) {
  var ms = Math.floor((t || 0) * 1000), sec = Math.floor(ms / 1000);
  var mm = Math.floor(sec / 60), hh = Math.floor(mm / 60);
  return conPad(hh, 2) + ':' + conPad(mm % 60, 2) + ':' + conPad(sec % 60, 2) + '.' + conPad(ms % 1000, 3);
}

function conUpdateCounter() {
  var input = conEl('cmd-input'), c = conEl('cmd-counter');
  if (!input || !c) return;
  var n = input.value.length;
  c.textContent = n + '/' + CON_MAX_LINE;
  c.className = 'cmd-counter' + (n > 200 ? ' warn' : '') + (n >= CON_MAX_LINE ? ' max' : '');
}

function conSetResult(text, exitCode, parseError) {
  var el = conEl('cmd-result');
  if (!el) return;
  var echo = conPendingTxt.length > 44 ? conPendingTxt.substring(0, 43) + '…' : conPendingTxt;
  var cls, label;
  if (exitCode === 0 && !parseError) { cls = 'ok'; label = 'exit 0'; }
  else if (exitCode === 3) { cls = 'err'; label = 'not found (3)'; }
  else { cls = 'err'; label = parseError ? 'parse error (' + parseError + ')' : 'exit ' + exitCode; }
  var extra = text ? ' <span class="echo">' + conEsc(text) + '</span>' : '';
  el.innerHTML = '<span class="echo">&gt; ' + conEsc(echo) + '</span><span class="code ' + cls + '">' +
                 conEsc(label) + '</span>' + extra;
}

function consoleResult(data) {
  var r = conParse(data);
  if (!r) return;
  if (conPending && r.seq !== conPending) return;   // stale result
  conPending = 0;
  conSetResult(r.text || '', r.exitCode | 0, r.parseError | 0);
}
window.consoleResult = consoleResult;

function conRenderAc() {
  var ac = conEl('ac');
  if (!ac) return;
  if (!conAc.length) { ac.className = 'ac'; ac.innerHTML = ''; return; }
  if (conAcSel >= conAc.length) conAcSel = 0;
  var html = '';
  for (var i = 0; i < conAc.length; ++i) {
    html += '<div class="ac-item' + (i === conAcSel ? ' sel' : '') + '" data-i="' + i + '"><span class="nm">' +
            conEsc(conAc[i].name) + '</span><span class="ds">' + conEsc(conAc[i].rank || '') + '</span></div>';
  }
  html += '<div class="ac-foot"><kbd>Tab</kbd> accept &nbsp;<kbd>&uarr;</kbd><kbd>&darr;</kbd> select</div>';
  ac.innerHTML = html;
  ac.className = 'ac show';
}
function conClearAc() { conAc = []; conAcSel = 0; conRenderAc(); }

function consoleCompletions(data) {
  var r = conParse(data);
  if (!r || !r.items) return;
  var input = conEl('cmd-input');
  // Ignore late results if the first token is gone or finished.
  if (!input || !input.value || input.value.indexOf(' ') >= 0) { conClearAc(); return; }
  conAc = r.items.slice(0, 5);
  conAcSel = 0;
  conRenderAc();
}
window.consoleCompletions = consoleCompletions;

function conAccept() {
  if (!conAc.length) return false;
  var input = conEl('cmd-input');
  input.value = conAc[conAcSel].name + ' ';
  conClearAc();
  conUpdateCounter();
  return true;
}

function consoleSetInput(data) {
  var r = conParse(data);
  var input = conEl('cmd-input');
  if (!r || !input) return;
  if (r.restore) { input.value = conDraft; conHistActive = false; }
  else input.value = r.text || '';
  conClearAc();
  conUpdateCounter();
}
window.consoleSetInput = consoleSetInput;

var conLogDirty = false;
document.addEventListener('selectionchange', function () {
  var sel = window.getSelection();
  if (conLogDirty && (!sel || sel.isCollapsed)) conRenderLog();
});

function conRenderLog() {
  var body = conEl('log-body');
  if (!body) return;
  // Don't rebuild the DOM while the user has text selected in the log (would wipe the selection).
  var sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed && body.contains(sel.anchorNode)) { conLogDirty = true; return; }
  conLogDirty = false;
  var stick = body.scrollHeight - body.scrollTop - body.clientHeight < 24;
  var html = '', shown = 0;
  for (var i = 0; i < conLogLines.length; ++i) {
    var l = conLogLines[i];
    if (conLogFilter !== 'ALL' && l.level !== conLogFilter) continue;
    ++shown;
    html += '<div class="log-line ' + l.level + '"><span class="log-ts">' + conStamp(l.t) +
            '</span><span class="badge ' + l.level + '">' + l.level + '</span><span class="log-ch">' +
            conEsc(l.channel) + '</span><span class="log-msg">' + conEsc(l.msg) + '</span></div>';
  }
  body.innerHTML = html || '<div class="log-empty">No log lines at this level</div>';
  if (stick) body.scrollTop = body.scrollHeight;
  var cnt = conEl('log-count');
  if (cnt) cnt.textContent = shown + ' / ' + conLogLines.length;
}

function appendLogLines(data) {
  var r = conParse(data);
  if (!r || !r.lines) return;
  for (var i = 0; i < r.lines.length; ++i) {
    var l = r.lines[i];
    var lvl = String(l.level || 'INFO').toUpperCase();
    if (lvl !== 'WARN' && lvl !== 'ERROR' && lvl !== 'INFO') lvl = 'INFO';  // DEBUG shown as INFO
    conLogLines.push({ t: l.t, level: lvl, channel: l.channel || '', msg: l.msg || '' });
  }
  if (conLogLines.length > CON_LOG_CAP) conLogLines.splice(0, conLogLines.length - CON_LOG_CAP);
  conRenderLog();
}
window.appendLogLines = appendLogLines;

function conSend(text) {
  var seq = ++conSeq;
  conPending = seq;
  conPendingTxt = text;
  var el = conEl('cmd-result');
  if (el) el.innerHTML = '<span class="echo">&gt; …</span>';
  if (text.length > CON_MAX_LINE) {
    conPending = 0;
    conSetResult('line too long', 2, 0);
    return;
  }
  if (!conApp('onConsoleLine')) { conPending = 0; return; }
  var p = ['', '', '', ''];
  for (var i = 0; i < 4; ++i) p[i] = text.substring(i * CON_CHUNK, (i + 1) * CON_CHUNK);
  app.onConsoleLine(seq, p[0], p[1], p[2], p[3]);
}

(function () {
  var input = conEl('cmd-input');
  if (!input) return;

  function requestComplete() {
    conAcTimer = null;
    var v = input.value;
    var sp = v.indexOf(' ');
    if (!v || sp >= 0) { conClearAc(); return; }
    if (conApp('onConsoleComplete')) app.onConsoleComplete(v.substring(0, 63));
  }

  input.addEventListener('input', function () {
    conHistActive = false;
    conUpdateCounter();
    if (conAcTimer) clearTimeout(conAcTimer);
    conAcTimer = setTimeout(requestComplete, 100);
  });

  input.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'Tab') { e.preventDefault(); conAccept(); }
    else if (k === 'Escape') { conClearAc(); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      var up = (k === 'ArrowUp');
      if (conAc.length && !conHistActive) {
        conAcSel = (conAcSel + (up ? conAc.length - 1 : 1)) % conAc.length;
        conRenderAc();
        return;
      }
      if (!conApp('onConsoleHistory')) return;
      if (!conHistActive) {
        if (!up) return;
        conDraft = input.value;
        conHistActive = true;
      }
      app.onConsoleHistory(up ? 'prev' : 'next');
    }
    else if (k === 'Enter') {
      var t = input.value.replace(/^\s+|\s+$/g, '');
      if (!t) return;
      if (conAcTimer) { clearTimeout(conAcTimer); conAcTimer = null; }
      conSend(t);
      input.value = '';
      conHistActive = false;
      conClearAc();
      conUpdateCounter();
    }
  });

  var ac = conEl('ac');
  if (ac) ac.addEventListener('mousedown', function (e) {
    var n = e.target;
    while (n && n !== ac && !(n.className && String(n.className).indexOf('ac-item') >= 0)) n = n.parentNode;
    if (!n || n === ac) return;
    e.preventDefault();
    conAcSel = parseInt(n.getAttribute('data-i'), 10) || 0;
    conAccept();
    input.focus();
  });

  var flt = conEl('log-filters');
  if (flt) flt.addEventListener('click', function (e) {
    e.stopPropagation();
    var b = e.target;
    if (!b || !b.getAttribute || !b.getAttribute('data-lvl')) return;
    conLogFilter = b.getAttribute('data-lvl');
    var all = flt.querySelectorAll('.flt');
    for (var i = 0; i < all.length; ++i) all[i].classList.toggle('active', all[i] === b);
    conRenderLog();
  });

  var hdr = conEl('log-hdr');
  if (hdr) hdr.addEventListener('click', function () {
    var v = conEl('log-view'), open = v.classList.contains('open');
    v.classList.toggle('open', !open);
    v.classList.toggle('closed', open);
  });

  conUpdateCounter();
  conRenderLog();
})();

// ── Command palette (panel-palette; contract in DebugPanelPage.h) ──────────
// Ctrl+P opens an overlay. JS -> C++: app.onPaletteOpen(), app.onPaletteSearch(query, mask)
// with mask "1" commands / "2" domains / "3" all. C++ -> JS: paletteResults(json|object).
// Enter on a "fill" item puts actionText in the console input (not run); on a
// "reveal" item it expands the group + card whose data-domain equals actionText.
var PAL_MAX_QUERY = 60;
var PAL_TABS = [ { mask: '3', label: 'All', key: 'all' },
                 { mask: '1', label: 'Commands', key: 'commands' },
                 { mask: '2', label: 'Domains', key: 'domains' } ];
var palTab    = 0;
var palSel    = 0;
var palItems  = [];
var palCounts = { all: 0, commands: 0, domains: 0 };
var palTotal  = 0;
var palTimer  = null;

function palIsOpen() {
  var o = conEl('pal-overlay');
  return !!o && o.className.indexOf('show') >= 0;
}

function palHighlight(name, hl) {
  var out = '';
  name = String(name || ''); hl = String(hl || '');
  for (var i = 0; i < name.length; ++i) {
    var ch = conEsc(name.charAt(i));
    out += (hl.charAt(i) === '1') ? '<mark>' + ch + '</mark>' : ch;
  }
  return out;
}

function palArgsHtml(args) {
  if (!Array.isArray(args) || !args.length) return '';
  var h = '<div class="pal-args">';
  for (var i = 0; i < args.length; ++i) {
    var a = args[i] || {};
    var meta = conEsc(a.type || '') + ' · ' + (a.required ? 'required' : 'optional');
    if (a.unit) meta += ' · ' + conEsc(a.unit);
    if (a.min != null && a.max != null) meta += ' · ' + conEsc(String(a.min)) + '..' + conEsc(String(a.max));
    if (Array.isArray(a.values) && a.values.length) {
      var vs = [];
      for (var k = 0; k < a.values.length; ++k) vs.push(a.values[k] == null ? '' : conEsc(a.values[k]));
      meta += ' · ' + vs.join('|');
    }
    h += '<div class="pal-arg"><span class="pal-arg-nm' + (a.required ? ' req' : '') + '">' + conEsc(a.name || '') +
         (a.required ? '' : '?') + '</span> <span class="pal-arg-meta">' + meta + '</span>' +
         (a.description ? ' <span class="pal-arg-ds">' + conEsc(a.description) + '</span>' : '') + '</div>';
  }
  return h + '</div>';
}

function palRender() {
  var tabs = conEl('pal-tabs'), list = conEl('pal-list'), tot = conEl('pal-tot');
  if (!tabs || !list) return;
  var th = '';
  for (var t = 0; t < PAL_TABS.length; ++t) {
    th += '<div class="pal-tab' + (t === palTab ? ' active' : '') + '" data-t="' + t + '">' + PAL_TABS[t].label +
          '<span class="n">' + (palCounts[PAL_TABS[t].key] | 0) + '</span></div>';
  }
  tabs.innerHTML = th;
  if (palSel >= palItems.length) palSel = Math.max(0, palItems.length - 1);
  var html = '';
  for (var i = 0; i < palItems.length; ++i) {
    var it = palItems[i], isDom = (it.type === 'domain');
    html += '<div class="pal-row' + (i === palSel ? ' sel' : '') + '" data-i="' + i + '"><span class="pal-type ' +
            (isDom ? 'domain' : 'command') + '">' + (isDom ? '▣' : '&gt;_') + '</span><div class="pal-info"><div class="pal-nm">' +
            palHighlight(it.name, it.hl) + '</div><div class="pal-ds">' + conEsc(it.description || '') +
            '</div>' + palArgsHtml(it.args) + '</div><span class="pal-cat">' + conEsc(it.category || '') + '</span></div>';
  }
  list.innerHTML = html || '<div class="pal-empty">No results found</div>';
  if (tot) tot.textContent = palTotal > palItems.length ? 'showing ' + palItems.length + ' of ' + palTotal
                                                         : palTotal + ' result' + (palTotal === 1 ? '' : 's');
  palScrollSel();
}

function palScrollSel() {
  var list = conEl('pal-list');
  if (!list) return;
  var rows = list.querySelectorAll('.pal-row');
  var r = rows[palSel];
  if (!r) return;
  if (r.offsetTop < list.scrollTop) list.scrollTop = r.offsetTop;
  else if (r.offsetTop + r.offsetHeight > list.scrollTop + list.clientHeight)
    list.scrollTop = r.offsetTop + r.offsetHeight - list.clientHeight;
}

function palSetSel(i) {
  var rows = conEl('pal-list').querySelectorAll('.pal-row');
  if (!rows.length) { palSel = 0; return; }
  palSel = (i + rows.length) % rows.length;
  for (var k = 0; k < rows.length; ++k) {
    rows[k].className = 'pal-row' + (k === palSel ? ' sel' : '');
  }
  palScrollSel();
}

function paletteResults(data) {
  var r = conParse(data);
  if (!r) return;
  palItems  = (r.items && r.items.length) ? r.items.slice(0, 50) : [];
  var c = r.counts || {};
  palCounts = { all: c.all | 0, commands: c.commands | 0, domains: c.domains | 0 };
  palTotal  = (typeof r.total === 'number') ? r.total : palItems.length;
  palSel    = 0;
  palRender();
}
window.paletteResults = paletteResults;

function palSearchNow() {
  if (palTimer) { clearTimeout(palTimer); palTimer = null; }
  var inp = conEl('pal-input');
  if (!inp || !conApp('onPaletteSearch')) return;
  var q = inp.value;
  if (q.length > PAL_MAX_QUERY) q = q.substring(0, PAL_MAX_QUERY);
  app.onPaletteSearch(q, PAL_TABS[palTab].mask);
}

function palOpen() {
  var inp = conEl('pal-input'), ov = conEl('pal-overlay');
  if (!inp || !ov) return;
  inp.value = '';
  palTab = 0; palSel = 0; palItems = []; palTotal = 0;
  palCounts = { all: 0, commands: 0, domains: 0 };
  ov.className = 'show';
  palRender();
  inp.focus();
  if (conApp('onPaletteOpen')) app.onPaletteOpen();
}

function palClose(focusConsole) {
  var ov = conEl('pal-overlay');
  if (palTimer) { clearTimeout(palTimer); palTimer = null; }
  if (ov) ov.className = '';
  if (focusConsole) { var ci = conEl('cmd-input'); if (ci) ci.focus(); }
}

function palRevealDomain(id) {
  var cards = document.querySelectorAll('.domain');
  var card = null;
  for (var i = 0; i < cards.length; ++i) {
    if (cards[i].getAttribute('data-domain') === id) { card = cards[i]; break; }
  }
  if (!card) return;
  var g = card.parentNode;
  while (g && !(g.className && String(g.className).indexOf('group ') === 0)) g = g.parentNode;
  if (g) {
    var gk = g.getAttribute('data-group-key');
    if (gk) ui.groupOpen[gk] = true;
    g.classList.add('open'); g.classList.remove('closed');
    g.classList.remove('hidden');
  }
  ui.domainOpen[id] = true;
  card.classList.add('open'); card.classList.remove('closed');
  card.classList.remove('hidden');
  try { card.scrollIntoView(true); } catch (e) { /* old engine */ }
  card.classList.add('flash');
  setTimeout(function () { card.classList.remove('flash'); }, 1500);
}

function palChoose(i) {
  var it = palItems[i];
  if (!it) return;
  palClose(false);
  if (it.action === 'reveal') {
    palRevealDomain(String(it.actionText || it.domainId || ''));
  } else {
    var ci = conEl('cmd-input');
    if (!ci) return;
    ci.value = String(it.actionText || it.name || '');
    conUpdateCounter();
    ci.focus();
    try { ci.setSelectionRange(ci.value.length, ci.value.length); } catch (e) { /* ignore */ }
  }
}

function palSwitchTab(t) {
  palTab = (t + PAL_TABS.length) % PAL_TABS.length;
  palSel = 0;
  palRender();
  palSearchNow();
}

document.addEventListener('keydown', function (e) {
  var k = e.key;
  if (e.ctrlKey && (k === 'p' || k === 'P')) {
    e.preventDefault();
    if (palIsOpen()) { var pi = conEl('pal-input'); if (pi) pi.focus(); }
    else palOpen();
    return;
  }
  if (!palIsOpen()) return;
  if (k === 'Escape') { e.preventDefault(); palClose(true); }
  else if (k === 'ArrowDown') { e.preventDefault(); palSetSel(palSel + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); palSetSel(palSel - 1); }
  else if (k === 'Enter') { e.preventDefault(); palChoose(palSel); }
  else if (k === 'Tab') { e.preventDefault(); palSwitchTab(palTab + (e.shiftKey ? -1 : 1)); }
});

(function () {
  var inp = conEl('pal-input');
  if (!inp) return;
  inp.addEventListener('input', function () {
    if (palTimer) clearTimeout(palTimer);
    palTimer = setTimeout(palSearchNow, 60);
  });
  var tabs = conEl('pal-tabs');
  if (tabs) tabs.addEventListener('click', function (e) {
    var n = e.target;
    while (n && n !== tabs && !(n.getAttribute && n.getAttribute('data-t') !== null)) n = n.parentNode;
    if (!n || n === tabs) return;
    palSwitchTab(parseInt(n.getAttribute('data-t'), 10) || 0);
    inp.focus();
  });
  var list = conEl('pal-list');
  function rowOf(e) {
    var n = e.target;
    while (n && n !== list && !(n.getAttribute && n.getAttribute('data-i') !== null)) n = n.parentNode;
    return (n && n !== list) ? parseInt(n.getAttribute('data-i'), 10) : -1;
  }
  if (list) {
    list.addEventListener('mousemove', function (e) { var i = rowOf(e); if (i >= 0 && i !== palSel) palSetSel(i); });
    list.addEventListener('click', function (e) { var i = rowOf(e); if (i >= 0) palChoose(i); });
  }
  var ov = conEl('pal-overlay');
  if (ov) ov.addEventListener('mousedown', function (e) { if (e.target === ov) palClose(true); });
  palRender();
})();

// ── Value schema + tooltips (DiaValueSchema Feature 3; spec tooltips.md) ──────
// A control may carry "schemaKey" ("<for>/<key>") and "packId". The page resolves label, range, step,
// decimals and the default tick from the cached schema; anything present on the control wins.
// JS -> C++: app.onValueSchemaGet(prefix)   prefix = "<for>/" (<= 63 chars), once per distinct prefix
//            per open; again only when a state frame's "schemaVersion" differs from the last one seen.
// C++ -> JS: valueSchemaResult(json|object)   the valueschema.get result {"version":N,"entries":[...]}
//            (sidecar field names: for, key, label, description, unit, min, max, default, ui{step,decimals}...).
// Panel rows are never "inspector" rows, so the tooltip omits Hint here.
// Tooltip placement (narrow left-docked panel): fixed under the (i), flipped above near the bottom of the
// view, clamped horizontally into the view, max width min(320, view width - 16).
var vs = {
  entries:   {},    // "<for>/<key>" -> schema entry
  requested: {},    // prefix -> true (asked for under the current schemaVersion)
  version:   null,  // last schemaVersion seen in a state frame
  gen:       0      // bumped when entries arrive; part of the structure signature
};

function vsPrefixOf(key) {
  var i = key.lastIndexOf('/');
  return i >= 0 ? key.substring(0, i + 1) : key;
}

function vsScan(data) {
  var wanted = [], seen = {}, ver = null;
  for (var name in data) {
    if (!Object.prototype.hasOwnProperty.call(data, name)) continue;
    var d = data[name];
    if (!d || typeof d !== 'object') continue;
    if (typeof d.schemaVersion === 'number') ver = d.schemaVersion;
    if (!Array.isArray(d.controls)) continue;
    for (var i = 0; i < d.controls.length; ++i) {
      var c = d.controls[i];
      if (!c || typeof c.schemaKey !== 'string' || !c.schemaKey) continue;
      var pre = vsPrefixOf(c.schemaKey);
      if (!seen[pre]) { seen[pre] = true; wanted.push(pre); }
    }
  }
  if (ver !== null) {
    if (vs.version !== null && vs.version !== ver) vs.requested = {};
    vs.version = ver;
  }
  for (var w = 0; w < wanted.length; ++w) {
    if (vs.requested[wanted[w]]) continue;
    vs.requested[wanted[w]] = true;
    if (conApp('onValueSchemaGet')) app.onValueSchemaGet(wanted[w]);
  }
}

function valueSchemaResult(data) {
  var r = conParse(data);
  if (!r || !Array.isArray(r.entries)) return;
  for (var i = 0; i < r.entries.length; ++i) {
    var e = r.entries[i];
    if (e && typeof e.for === 'string' && typeof e.key === 'string') vs.entries[e.for + '/' + e.key] = e;
  }
  ++vs.gen;
  if (latest && typeof latest === 'object') updateDomainState(latest);
}
window.valueSchemaResult = valueSchemaResult;

function vsEntryFor(def) {
  if (!def || typeof def.schemaKey !== 'string') return null;
  return Object.prototype.hasOwnProperty.call(vs.entries, def.schemaKey) ? vs.entries[def.schemaKey] : null;
}

function vtIsSet(v) { return v !== undefined && v !== null; }

// Control value wins; else the schema; else the page default.
function resolveControl(def) {
  var entry = vsEntryFor(def);
  var u = (entry && entry.ui && typeof entry.ui === 'object') ? entry.ui : {};
  var id = controlId(def);
  var dflt = entry ? entry.default : undefined;
  function pick(own, fromEntry, fallback) {
    if (vtIsSet(own)) return own;
    if (vtIsSet(fromEntry)) return fromEntry;
    return fallback;
  }
  var rc = {
    id:       id,
    entry:    entry,
    label:    def.label || (entry && entry.label) || def.name || def.key,
    min:      pick(def.min, entry ? entry.min : undefined, 0),
    max:      pick(def.max, entry ? entry.max : undefined, 1),
    step:     pick(def.step, u.step, 0.01),
    decimals: pick(def.decimals, u.decimals, null),
    hasDefault: typeof dflt === 'number' && isFinite(dflt),
    defaultValue: dflt
  };
  return rc;
}

// ── renderValueTooltip: DOM contract shared with @dia/editor-ui ValueTooltip ──
// (see Cluiche/Tests/Contracts/valuetooltip/README.md). Root has data-vt-tooltip; each present
// section is a direct child with data-vt-section="<name>"; empty sections are absent.
function vtFormatRange(min, max) {
  if (vtIsSet(min) && vtIsSet(max)) return String(min) + ' – ' + String(max);
  if (vtIsSet(min)) return '≥ ' + String(min);
  if (vtIsSet(max)) return '≤ ' + String(max);
  return null;
}

function vtFormatDefault(value, decimals) {
  if (typeof value === 'number' && vtIsSet(decimals)) return value.toFixed(decimals);
  return String(value);
}

function vtSection(root, name, cls, text) {
  var n = el('div', cls);
  n.setAttribute('data-vt-section', name);
  if (text !== undefined) n.textContent = vtIsSet(text) ? String(text) : '';
  root.appendChild(n);
  return n;
}

function renderValueTooltip(entry, options) {
  entry = entry || {};
  options = options || {};
  var forId = vtIsSet(options.forId) ? options.forId : entry.for;
  var resolvable = Array.isArray(options.resolvable) ? options.resolvable : [];

  var root = el('div', 'vt');
  root.setAttribute('role', 'tooltip');
  root.setAttribute('data-vt-tooltip', '');

  vtSection(root, 'title', 'vt-title', entry.label);
  vtSection(root, 'description', 'vt-desc', entry.description);

  if (Array.isArray(entry.values) && entry.values.length) {
    var ev = vtSection(root, 'enum_values', 'vt-enum');
    for (var i = 0; i < entry.values.length; ++i) {
      var v = entry.values[i] || {};
      var row = el('div');
      row.setAttribute('data-vt-enum-id', vtIsSet(v.id) ? String(v.id) : '');
      var l = el('span', 'vt-enum-label', vtIsSet(v.label) ? String(v.label) : '');
      l.setAttribute('data-vt-enum-label', '');
      var ds = el('span', 'vt-enum-desc', vtIsSet(v.description) ? String(v.description) : '');
      ds.setAttribute('data-vt-enum-desc', '');
      row.appendChild(l);
      row.appendChild(document.createTextNode(' '));
      row.appendChild(ds);
      ev.appendChild(row);
    }
  }

  if (options.inspector && entry.hint) vtSection(root, 'hint', 'vt-hint', entry.hint);

  var meta = [];
  if (entry.unit) meta.push(['unit', String(entry.unit)]);
  var range = vtFormatRange(entry.min, entry.max);
  if (range !== null) meta.push(['range', range]);
  if (vtIsSet(entry.default)) meta.push(['default', vtFormatDefault(entry.default, entry.ui ? entry.ui.decimals : undefined)]);
  if (meta.length) {
    var mn = vtSection(root, 'meta', 'vt-meta');
    for (var m = 0; m < meta.length; ++m) {
      var item = el('span', 'vt-meta-item');
      item.setAttribute('data-vt-kind', meta[m][0]);
      item.appendChild(el('span', 'vt-meta-label', meta[m][0]));
      var val = el('span', 'vt-meta-value', meta[m][1]);
      val.setAttribute('data-vt-value', '');
      item.appendChild(val);
      mn.appendChild(item);
    }
  }

  if (Array.isArray(entry.affects) && entry.affects.length) {
    var af = vtSection(root, 'affects', 'vt-affects');
    for (var a = 0; a < entry.affects.length; ++a) {
      var chip = el('span', 'vt-chip', String(entry.affects[a]));
      chip.setAttribute('data-vt-chip', String(entry.affects[a]));
      af.appendChild(chip);
    }
  }

  if (Array.isArray(entry.related) && entry.related.length) {
    var rl = vtSection(root, 'related', 'vt-related');
    rl.appendChild(el('span', 'vt-related-label', 'Related:'));
    for (var r = 0; r < entry.related.length; ++r) {
      (function (key) {
        var isLink = resolvable.indexOf(key) >= 0;
        var node = el(isLink ? 'button' : 'span', isLink ? 'vt-link' : 'vt-plain', key);
        node.setAttribute('data-vt-key', key);
        node.setAttribute('data-vt-link', isLink ? 'true' : 'false');
        if (isLink) {
          node.setAttribute('type', 'button');
          node.addEventListener('click', function (e) {
            e.stopPropagation();
            if (typeof options.onFocusKey === 'function') options.onFocusKey(key);
          });
        }
        rl.appendChild(node);
      })(String(entry.related[r]));
    }
  }

  if (entry.source) {
    var sn = vtSection(root, 'source', 'vt-source');
    var s1 = el('span', '', String(entry.source));
    s1.setAttribute('data-vt-source', '');
    var s2 = el('span', '', String(forId) + ' · ' + String(entry.key));
    s2.setAttribute('data-vt-defined-in', '');
    sn.appendChild(s1);
    sn.appendChild(document.createTextNode(' · Defined in '));
    sn.appendChild(s2);
  }

  if (options.packId) vtSection(root, 'pack_badge', 'vt-pack', 'overridden by pack ' + options.packId);

  return root;
}
window.renderValueTooltip = renderValueTooltip;

// ── (i) icon wiring: hover / focus opens, blur / leave / Esc closes ──────────
var vt = { el: null, timer: null };

function vtCancelHide() { if (vt.timer) { clearTimeout(vt.timer); vt.timer = null; } }
function vtScheduleHide() { vtCancelHide(); vt.timer = setTimeout(vtClose, 150); }
function vtClose() {
  vtCancelHide();
  if (vt.el && vt.el.parentNode) vt.el.parentNode.removeChild(vt.el);
  vt.el = null;
}

function vtFindControl(fullKey) {
  var all = document.querySelectorAll('.ctrl[data-schema-key]');
  for (var i = 0; i < all.length; ++i) {
    if (all[i].getAttribute('data-schema-key') === fullKey) return all[i];
  }
  return null;
}

function vtResolvable(entry) {
  var out = [];
  if (!Array.isArray(entry.related)) return out;
  for (var i = 0; i < entry.related.length; ++i) {
    if (vtFindControl(entry.for + '/' + entry.related[i])) out.push(String(entry.related[i]));
  }
  return out;
}

// Related link: reveal the card holding the matching control (if collapsed), then focus its slider.
function vtFocusControl(fullKey) {
  var c = vtFindControl(fullKey);
  vtClose();
  if (!c) return;
  var card = c.parentNode;
  while (card && !(card.className && String(card.className).indexOf('domain ') === 0)) card = card.parentNode;
  if (card) palRevealDomain(card.getAttribute('data-domain'));
  var range = c.querySelector('input[type=range]');
  if (range) range.focus();
}

function vtShow(icon, def) {
  var entry = vsEntryFor(def);
  if (!entry) { vtClose(); return; }
  vtShowEntry(icon, entry, {
    inspector: false,
    packId: def.packId || null,
    resolvable: vtResolvable(entry),
    forId: entry.for,
    onFocusKey: function (key) { vtFocusControl(entry.for + '/' + key); }
  });
}

function vtShowEntry(icon, entry, options) {
  vtClose();
  var tip = renderValueTooltip(entry, options);
  tip.addEventListener('mouseenter', vtCancelHide);
  tip.addEventListener('mouseleave', vtScheduleHide);

  var vw = window.innerWidth || document.documentElement.clientWidth || 520;
  var vh = window.innerHeight || document.documentElement.clientHeight || 600;
  tip.style.position = 'fixed';
  tip.style.maxWidth = Math.min(320, vw - 16) + 'px';
  tip.style.width = tip.style.maxWidth;
  tip.style.left = '0px';
  tip.style.top = '0px';
  document.body.appendChild(tip);
  vt.el = tip;

  var rect = icon.getBoundingClientRect();
  var tw = tip.offsetWidth || 320, th = tip.offsetHeight || 0;
  var left = Math.max(8, Math.min(rect.left, vw - tw - 8));
  var top = rect.bottom + 6;
  if (top + th > vh - 8 && rect.top - th - 6 >= 8) top = rect.top - th - 6;   // flip above
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}

function vtBuildIcon(rc, def) {
  var icon = el('span', 'info-icon', 'i');
  icon.setAttribute('tabindex', '0');
  icon.setAttribute('role', 'button');
  icon.setAttribute('data-role', 'info');
  icon.setAttribute('aria-label', 'About ' + rc.label);
  icon.addEventListener('mouseenter', function () { vtCancelHide(); vtShow(icon, def); });
  icon.addEventListener('mouseleave', vtScheduleHide);
  icon.addEventListener('focus', function () { vtCancelHide(); vtShow(icon, def); });
  icon.addEventListener('blur', vtScheduleHide);
  return icon;
}

// (i) icon for a plain entry {key,label,description,unit} (cell layer picker rows). Clicking it never reaches the row.
function vtBuildEntryIcon(entry) {
  var icon = el('span', 'info-icon', 'i');
  icon.setAttribute('tabindex', '0');
  icon.setAttribute('role', 'button');
  icon.setAttribute('data-role', 'info');
  icon.setAttribute('aria-label', 'About ' + entry.label);
  function open() { vtCancelHide(); vtShowEntry(icon, entry, { inspector: false }); }
  icon.addEventListener('mouseenter', open);
  icon.addEventListener('mouseleave', vtScheduleHide);
  icon.addEventListener('focus', open);
  icon.addEventListener('blur', vtScheduleHide);
  icon.addEventListener('click', function (e) { e.stopPropagation(); });
  return icon;
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && vt.el) vtClose();
});

// ── Global scale slider ──────────────────────────────────────────────────
(function () {
  var range   = document.getElementById('scale-range');
  var display = document.getElementById('scale-display');
  range.addEventListener('input', function () {
    display.textContent = range.value;
  });
  range.addEventListener('change', function () {
    display.textContent = range.value;
    sendCommand('__global__', 'setScale', { key: 'debugScale', value: parseFloat(range.value) });
  });
})();
</script>
</body>
</html>
