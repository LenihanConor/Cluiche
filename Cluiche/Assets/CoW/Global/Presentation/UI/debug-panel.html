<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dia Debug Panel</title>
<!--
  DiaDebugPanel — Phase 1.

  Rendered by Ultralight as an overlay on the left side of the game viewport
  (SD-007). Styling is lifted verbatim from the approved UX mockup at
  docs/research/visual_debugger_redesign/mockup.html.

  No CDN / external assets: Ultralight runs fully offline.

  C++ -> JS   updateDomainState(data)      pushed once per frame
  JS   -> C++ app.onCommand(domainId, cmd, argsJson)

  Phase 2 (built): search bar (domain filter), entity-lock field, command
  strip (debug.layer.* commands). Domain filtering across modules via
  IDebugDomain::SetFocusEntity is a follow-up task.
-->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px;
  color: #d4d4d4;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* ─────────────────────────────── PANEL ─── */
#panel {
  position: fixed;
  top: 0; left: 0;
  width: 520px;
  height: 100vh;
  background: #181818;
  border-right: 1px solid #2a2a2a;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Panel header ── */
.panel-header {
  background: #1f1f1f;
  border-bottom: 1px solid #2d2d2d;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.panel-title {
  font-size: 10px;
  color: #7a7a7a;
  letter-spacing: 2px;
  font-weight: 700;
  flex: 1;
}
.scale-row {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: #555;
}
.scale-row input[type=range] {
  width: 55px; height: 3px;
  accent-color: #5a9fd4; cursor: pointer;
}
#scale-display { color: #9a9a9a; width: 22px; text-align: right; }

/* ── Groups list ── */
.groups-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #2d2d2d transparent;
}

/* ── Empty state ── */
.empty-state {
  padding: 18px 12px;
  font-size: 11px;
  color: #3a3a3a;
  font-style: italic;
  text-align: center;
}

/* ── Group ── */
.group { border-top: 1px solid #1f1f1f; }

.group-hdr {
  display: flex;
  align-items: center;
  padding: 6px 10px;
  cursor: pointer;
  gap: 8px;
  background: #181818;
}
.group-hdr:hover { background: #1e1e1e; }

.group-arrow { width: 10px; font-size: 9px; color: #3a3a3a; flex-shrink: 0; }
.group.open  .group-arrow::after { content: '▼'; }
.group.closed .group-arrow::after { content: '▶'; }

.group-label {
  font-size: 10px;
  letter-spacing: 1.2px;
  font-weight: 700;
  text-transform: uppercase;
  flex: 1;
  color: var(--accent);
  opacity: 0.85;
}

.group-meta { font-size: 10px; color: #333; margin-right: 4px; }

.btn-all {
  font-family: inherit; font-size: 9px;
  padding: 2px 7px;
  border: 1px solid;
  cursor: pointer; background: transparent;
  line-height: 1.6;
}
.btn-all.on  { border-color: #1e3a1e; color: #3a7a3a; }
.btn-all.on:hover  { background: #111d11; color: #5aaa5a; }
.btn-all.off { border-color: #3a1e1e; color: #7a3a3a; }
.btn-all.off:hover { background: #1d1111; color: #aa5a5a; }

.group-body {
  padding: 4px 8px 6px 8px;
  background: #131313;
}
.group.closed .group-body { display: none; }

/* ── Domain Card ── */
.domain {
  margin-bottom: 3px;
  border: 1px solid #222;
  background: #1b1b1b;
}
.domain.enabled  { border-left: 2px solid var(--accent); }
.domain.disabled { border-left: 2px solid #2a2a2a; opacity: 0.55; }

.domain-hdr {
  display: flex;
  align-items: center;
  padding: 5px 8px;
  gap: 7px;
  cursor: pointer;
}
.domain-hdr:hover { background: #202020; }

.tog {
  width: 13px; height: 13px;
  border: 1px solid #444;
  flex-shrink: 0; display: flex;
  align-items: center; justify-content: center;
  font-size: 8px; cursor: pointer;
}
.tog.on  { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
.tog.on::after  { content: '✓'; }
.tog.off::after { content: ''; }

.domain-name {
  flex: 1; font-size: 12px; font-weight: 600; color: #aaa;
}
.domain.enabled .domain-name { color: var(--accent); }

.domain-stat { font-size: 10px; color: #3a3a3a; }
.domain.enabled .domain-stat { color: #555; }

.expand-btn { width: 12px; font-size: 9px; color: #333; flex-shrink: 0; text-align: center; }
.domain.open   .expand-btn::after { content: '▼'; }
.domain.closed .expand-btn::after { content: '▶'; }

.domain-body {
  padding: 6px 10px 8px 10px;
  border-top: 1px solid #202020;
}
.domain.closed .domain-body { display: none; }

/* Drawers */
.drawers {
  display: flex; flex-wrap: wrap; gap: 5px 12px; margin-bottom: 8px;
}
.dr {
  display: flex; align-items: center; gap: 4px;
  cursor: pointer; font-size: 11px; color: #555;
}
.dr.on { color: #b0b0b0; }
.dr-box {
  width: 11px; height: 11px;
  border: 1px solid #3a3a3a; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 8px;
}
.dr.on .dr-box { background: var(--accent); border-color: var(--accent); color: #000; }
.dr.on .dr-box::after { content: '✓'; }

/* Stats */
.stats {
  display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 3px;
  padding: 5px 0; margin-bottom: 6px;
  border-top: 1px solid #1e1e1e; border-bottom: 1px solid #1e1e1e;
}
.stats:empty { display: none; }
.s { font-size: 10px; color: #444; }
.s .v { color: #777; }
.s .v.w { color: #c8882a; }
.s .v.e { color: #c03030; }
.s .v.g { color: #3a9a5a; }

/* Controls */
.controls { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
.controls:empty { display: none; }
.ctrl {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; color: #444;
}
.ctrl span.ctrl-label { width: 96px; flex-shrink: 0; }
.ctrl input[type=range] {
  flex: 1; height: 3px;
  accent-color: var(--accent); cursor: pointer;
}
.ctrl .cv { width: 30px; text-align: right; color: #666; }
.ctrl .track { position: relative; flex: 1; display: flex; align-items: center; min-width: 0; }
.ctrl .track input[type=range] { width: 100%; }
.dtick { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: #f5a623; opacity: 0.6; pointer-events: none; }
.pack-marker { flex-shrink: 0; font-size: 8px; padding: 0 4px; background: #2a2510; border: 1px solid #4a4520; color: #f5a623; }

/* Value info icon + tooltip (DiaValueSchema F3; mockup f3-worldassets/mockups/field-schema-tooltips.html) */
.info-icon {
  width: 12px; height: 12px; flex-shrink: 0;
  border: 1px solid #3a3a3a; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 8px; color: #666; cursor: help; outline: none;
}
.info-icon:hover, .info-icon:focus { border-color: #5a9fd4; color: #5a9fd4; }
.vt {
  position: fixed; z-index: 100; box-sizing: border-box; width: 320px; max-width: 320px;
  background: #2a2a2a; border: 1px solid #4a4a4a; border-radius: 3px; padding: 10px 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.7);
  font-size: 10px; color: #ccc; text-align: left; font-weight: normal; user-select: none;
}
.vt [data-vt-section] { margin-top: 6px; }
.vt .vt-title { margin-top: 0; font-size: 11px; color: #5a9fd4; font-weight: 600; }
.vt .vt-desc { color: #aaa; line-height: 1.4; }
.vt .vt-enum-label { color: #ccc; font-weight: 600; }
.vt .vt-enum-desc { color: #777; }
.vt .vt-hint { color: #f5a623; font-style: italic; }
.vt .vt-meta { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; border-top: 1px solid #333; font-size: 9px; color: #777; }
.vt .vt-meta-item { display: flex; gap: 4px; }
.vt .vt-meta-label { color: #555; }
.vt .vt-meta-value { color: #999; }
.vt .vt-affects { display: flex; flex-wrap: wrap; gap: 4px; }
.vt .vt-chip { font-size: 8px; padding: 2px 6px; background: #1a2530; border: 1px solid #2a3a50; color: #5a9fd4; border-radius: 2px; }
.vt .vt-related { padding-top: 6px; border-top: 1px solid #333; font-size: 9px; color: #777; }
.vt .vt-related-label { color: #666; font-weight: 700; margin-right: 4px; }
.vt .vt-link { background: transparent; border: none; padding: 0; margin-right: 8px; font-family: inherit; font-size: 9px; color: #5a9fd4; cursor: pointer; text-decoration: none; }
.vt .vt-link:hover, .vt .vt-link:focus { text-decoration: underline; }
.vt .vt-plain { margin-right: 8px; }
.vt .vt-source { font-size: 9px; color: #555; font-style: italic; }
.vt .vt-pack { display: inline-block; font-size: 8px; padding: 2px 5px; background: #2a2510; border: 1px solid #4a4520; color: #f5a623; border-radius: 2px; }

/* Cell layer viewer card (DiaCellLayers; mockup diacelllayers/mockups/cell-layer-viewer.html) */
.cl-viewer { margin-bottom: 6px; }
.cl-empty { padding: 10px 6px; font-size: 11px; color: #555; font-style: italic; text-align: center; }
.cl-grids { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.cl-viewer .tool-btn {
  padding: 3px 8px; background: #252525; border: 1px solid #3a3a3a; color: #999;
  border-radius: 2px; font-size: 9px; cursor: pointer; font-family: inherit;
}
.cl-viewer .tool-btn.active { background: #5a9fd4; color: #fff; border-color: #5a9fd4; }
.selection-header { font-size: 11px; color: #5a9fd4; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #222; }
.selection-tools { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.selection-group { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; }
.selection-group select {
  flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc;
  font-family: inherit; font-size: 10px; padding: 3px 4px; border-radius: 2px; outline: none; text-transform: none; letter-spacing: 0;
}
.selection-group select:focus { border-color: #5a9fd4; }
.query-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; padding: 6px 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 2px; }
.query-row { display: flex; gap: 4px; }
.query-input { flex: 1; min-width: 0; background: #0f0f0f; border: 1px solid #3a3a3a; color: #ccc; font-family: 'Consolas', monospace; font-size: 10px; padding: 4px 6px; border-radius: 2px; outline: none; }
.query-input:focus { border-color: #5a9fd4; }
.query-field .query-run { background: #1e1e1e; color: #ccc; border: 1px solid #3a3a3a; border-radius: 2px; font-size: 9px; font-family: inherit; padding: 2px 8px; cursor: pointer; }
.query-field .query-run:hover { border-color: #5a9fd4; }
.query-result { font-size: 9px; color: #5a9fd4; }
.query-result:empty { display: none; }
.query-error { font-size: 9px; color: #f5a623; }
.query-error .q-msg { color: #e8573f; }
.query-error .q-text { font-family: 'Consolas', monospace; color: #999; margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
.query-error mark.q-span { background: #5a2a22; color: #ffb3a6; border-radius: 1px; }
.query-error .q-suggest { background: none; border: 0; padding: 0; color: #5a9fd4; font-family: inherit; font-size: 9px; cursor: pointer; text-decoration: underline; }
.query-recent { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
.query-recent .q-recent-title { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; }
.query-recent .q-recent-item { font-family: 'Consolas', monospace; font-size: 9px; color: #888; padding: 1px 4px; cursor: pointer; border-radius: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.query-recent .q-recent-item:hover { background: #252525; color: #ccc; }
.cl-banner { padding: 6px 8px; font-size: 10px; color: #f5a623; background: #2a2510; border: 1px solid #4a4520; border-radius: 2px; margin-bottom: 8px; }
/* Cell History card (DiaCellHistory F2; mockup diacelllayers/mockups/cell-layer-viewer.html: timeline card, banner, notices) */
.cl-tl { padding: 2px 0 4px; }
.cl-tl .tl-head { display: flex; align-items: center; gap: 10px; font-size: 9px; color: #888; margin-bottom: 3px; flex-wrap: wrap; }
.cl-tl .tl-title { color: #aaa; font-weight: 600; letter-spacing: 0.5px; }
.cl-tl .tl-layer { color: #5a9fd4; }
.cl-tl .tl-legend { margin-left: auto; display: flex; gap: 8px; align-items: center; color: #666; flex-wrap: wrap; }
.cl-tl .tl-legend i { display: inline-block; width: 6px; height: 8px; margin-right: 3px; vertical-align: -1px; }
.cl-tl .tl-legend .density { display: inline-flex; align-items: flex-end; gap: 1px; margin: 0 3px; }
.cl-tl .tl-legend .density b { width: 2px; background: #aaa; display: inline-block; }
.tl-plot { position: relative; height: 96px; margin: 0 4px; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 2px; overflow: hidden; cursor: pointer; }
.tl-spark { position: absolute; left: 0; right: 0; top: 2px; height: 32px; width: 100%; }
.tl-spark path { fill: none; stroke: #6fb36f; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.tl-lane { position: absolute; left: 0; right: 0; top: 40px; bottom: 14px; }
.tl-lane-track { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #3a3a3a; }
.tl-band { position: absolute; top: -40px; bottom: -14px; width: 1px; background: #232323; }
.tl-band.major { background: #3a3a3a; }
.tl-band-label { position: absolute; bottom: -13px; font-size: 8px; color: #666; transform: translateX(2px); }
.tl-band-label.major { color: #999; }
.tl-ev { position: absolute; bottom: 50%; width: 2px; margin-bottom: 2px; border-radius: 1px; }
.tl-gap { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(231,76,60,0.28) 0 3px, transparent 3px 6px); border-left: 1px solid #7a3a34; border-right: 1px solid #7a3a34; }
.tl-gap.events { background: repeating-linear-gradient(135deg, rgba(245,166,35,0.22) 0 3px, transparent 3px 6px); border-color: #7a5a24; top: 38px; bottom: 14px; }
.tl-gap-label { position: absolute; font-size: 8px; white-space: nowrap; }
.tl-dim { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.55); border-right: 1px dashed #5a9fd4; }
.tl-dim-label { position: absolute; top: 3px; right: 3px; font-size: 8px; color: #5a9fd4; background: #0f0f0fcc; padding: 0 3px; }
.tl-thumb { position: absolute; top: 0; bottom: 0; width: 2px; background: #e8e8e8; z-index: 5; }
.tl-thumb::before { content: ''; position: absolute; top: 36px; left: -5px; width: 12px; height: 16px; background: #e8e8e8; border-radius: 2px; border: 1px solid #5a9fd4; }
.tl-thumb .tl-thumb-tag { position: absolute; top: 2px; left: 6px; font-size: 9px; white-space: nowrap; background: #1a2530; border: 1px solid #5a9fd4; color: #9fd0f5; padding: 0 4px; border-radius: 2px; }
.tl-thumb.flip .tl-thumb-tag { left: auto; right: 6px; }
.tl-livemark { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: #4a8a4a; z-index: 4; }
.tl-livemark span { position: absolute; bottom: 2px; right: 5px; font-size: 8px; color: #8aea8a; background: #0f0f0fcc; padding: 0 3px; white-space: nowrap; }
.tl-livemark::before { content: ''; position: absolute; top: 6px; right: 0; width: 7px; height: 7px; border-radius: 50%; background: #8aea8a; }
.cl-tl:not(.is-live) .tl-livemark { opacity: 0.6; }
.cl-tl:not(.is-live) .tl-livemark::before { background: transparent; border: 1px solid #8aea8a; }
.cl-tl .tl-controls { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.cl-tl .tl-btn { background: #1f1f1f; border: 1px solid #3a3a3a; color: #bbb; font-family: inherit; font-size: 10px; padding: 2px 7px; border-radius: 2px; cursor: pointer; }
.cl-tl .tl-btn:hover { background: #2a2a2a; color: #fff; }
.cl-tl .tl-btn[disabled] { opacity: 0.4; cursor: default; }
.cl-tl .tl-btn.ev-prev, .cl-tl .tl-btn.ev-next { border-color: #5a4a2a; color: #f5a623; }
.cl-tl .tl-sep { width: 1px; height: 16px; background: #333; margin: 0 4px; }
.cl-tl .tl-pos { font-size: 10px; color: #ccc; margin-left: 8px; }
.cl-tl .tl-pos .dim { color: #666; }
.cl-tl .live-btn { margin-left: auto; }
.cl-tl.is-live .live-btn { background: #1d2a1d; border-color: #2f4f2f; color: #5a8a5a; cursor: default; }
.cl-tl .tl-info { margin-top: 5px; font-size: 9px; color: #666; }
.cl-hist-banner { display: flex; align-items: center; gap: 12px; padding: 6px 12px; margin-bottom: 8px; font-size: 11px; background: #3a2a0a; border: 1px solid #f5a623; border-radius: 2px; color: #ffd27a; }
.cl-hist-banner b { color: #fff; font-weight: 600; }
.cl-hist-banner .vb-extra { color: #ffb3a8; }
.cl-hist-banner .live-btn { margin-left: auto; background: #1f1f1f; border: 1px solid #3a3a3a; color: #bbb; font-family: inherit; font-size: 10px; padding: 2px 7px; border-radius: 2px; cursor: pointer; }
.cl-hist-notice { padding: 16px 20px; margin-bottom: 8px; border-radius: 3px; font-size: 11px; line-height: 1.5; text-align: center; }
.cl-hist-notice h4 { font-size: 12px; margin: 0 0 6px 0; font-weight: 600; }
.cl-hist-notice.untracked { background: repeating-linear-gradient(0deg, #17171c 0 20px, #14141a 20px 40px); border: 1px solid #3a3a3a; color: #aaa; }
.cl-hist-notice.untracked h4 { color: #ddd; }
.cl-hist-notice.evicted { background: repeating-linear-gradient(135deg, #1a1210 0 10px, #140e0c 10px 20px); border: 1px solid #7a3a34; color: #e0a8a0; }
.cl-hist-notice.evicted h4 { color: #e74c3c; }
.cl-hist-notice .track-btn { margin-top: 10px; padding: 4px 14px; background: #1a2530; border: 1px solid #5a9fd4; color: #5a9fd4; font-family: inherit; font-size: 11px; border-radius: 2px; cursor: pointer; }
.cl-hist-notice .runs { color: #666; font-size: 9px; margin-top: 6px; }
.sample-badge { display: inline-block; font-size: 9px; padding: 0 5px; margin-bottom: 3px; background: #3a2a0a; border: 1px solid #f5a623; color: #ffd27a; border-radius: 2px; }
/* Selection Inspector card (diacelllayers/mockups/cell-layer-viewer.html: stats table, biome chips, histogram, pin buttons) */
.cl-inspector { margin-top: 4px; margin-bottom: 8px; padding-top: 6px; border-top: 1px solid #222; }
.insp-title { display: flex; align-items: center; gap: 8px; font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.insp-updating { font-size: 8px; padding: 1px 5px; border-radius: 2px; background: #2a2510; border: 1px solid #4a4520; color: #f5a623; text-transform: none; letter-spacing: 0; }
.insp-empty { padding: 8px 6px; font-size: 11px; color: #555; font-style: italic; text-align: center; }
.pin-buttons { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
.pin-btn { flex: 1; padding: 4px 8px; background: #252525; border: 1px solid #3a3a3a; color: #999; border-radius: 2px; font-size: 9px; cursor: pointer; font-family: inherit; }
.pin-btn:hover { background: #2a2a2a; color: #ccc; }
.pin-btn[disabled] { opacity: 0.4; cursor: default; }
.pinned-chip { display: inline-block; font-size: 9px; padding: 4px 8px; background: #1a2530; border: 1px solid #2a3a50; color: #5a9fd4; border-radius: 2px; margin-bottom: 6px; }
.frozen-badge { display: inline-block; font-size: 8px; padding: 1px 5px; margin-left: 4px; border-radius: 2px; background: #1a2a3a; border: 1px solid #3a5a80; color: #8fc4f0; }
.insp-group { margin-bottom: 6px; }
.insp-group-header { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.8px; padding: 4px 6px; background: #1a1a1a; border-radius: 2px; cursor: pointer; user-select: none; }
.insp-group-header:hover { color: #ccc; }
.insp-group-header .caret { display: inline-block; width: 10px; color: #5a9fd4; }
.insp-scroll { overflow-x: auto; }
.stats-table { width: 100%; border-collapse: collapse; font-size: 10px; margin: 4px 0; }
.stats-table th { background: #1a1a1a; padding: 3px 4px; text-align: left; font-weight: 600; color: #777; font-size: 9px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
.stats-table th.cmp-a { color: #8fc4f0; }
.stats-table th.cmp-d { color: #5a9fd4; }

<div id="panel">

    <span class="panel-title">DIA&nbsp;&nbsp;DEBUG</span>

           onfocus="pushUIOnlyMode()" onblur="popInputMode()">

  <div class="groups-list" id="groups-list">

           onfocus="pushUIOnlyMode()" onblur="popInputMode()">

  <div class="log-view open" id="log-view">

      <div class="log-filters" id="log-filters">

        <button class="flt" data-lvl="WARN">Warn</button><button class="flt" data-lvl="ERROR">Error</button></div></div>
    <div class="log-body" id="log-body"></div>
  </div>

  <div class="command-strip">
    <div class="ac" id="ac"></div>
    <div class="cmd-row"><span class="cmd-prefix">&gt;</span>
      <input class="cmd-input" id="cmd-input" type="text" maxlength="240" spellcheck="false" autocomplete="off" placeholder="debug.layer.enable…" onfocus="pushUIOnlyMode()" onblur="popInputMode()">
      <span class="cmd-counter" id="cmd-counter"></span></div>
    <div class="cmd-meta"><span class="cmd-result" id="cmd-result"></span>
      <span class="cmd-hint"><kbd>&uarr;</kbd><kbd>&darr;</kbd> history &nbsp;<kbd>Tab</kbd> complete &nbsp;<kbd>Ctrl+P</kbd> palette</span></div>
  </div>

  <div id="pal-overlay">
    <div class="pal">
      <input class="pal-input" id="pal-input" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Search commands and domains…" onfocus="pushUIOnlyMode()" onblur="popInputMode()">
      <div class="pal-tabs" id="pal-tabs"></div>
      <div class="pal-list" id="pal-list"></div>
      <div class="pal-foot"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span><span><kbd>Enter</kbd> select</span><span><kbd>Tab</kbd> tab</span><span><kbd>Esc</kbd> close</span><span class="tot" id="pal-tot"></span></div>
    </div>
  </div>

</div>

<script>
'use strict';

// ── Canonical group order + display labels (DiaDebugDomain spec) ───────────
var GROUP_ORDER = [
  { key: 'Physics',    label: 'Physics',          css: 'physics'    },
  { key: 'Animation',  label: 'Animation',        css: 'animation'  },
  { key: 'Navigation', label: 'Navigation',       css: 'navigation' },
  { key: 'AIBehavior', label: 'AI/Behavior',      css: 'aibehavior' },
  { key: 'Rendering',  label: 'Rendering',        css: 'rendering'  },
  { key: 'Spatial',    label: 'Spatial/Geometry', css: 'spatial'    },
  { key: 'Entity',     label: 'Entity',           css: 'entity'     },
  { key: 'CoreDebug',  label: 'Core Debug',       css: 'coredebug'  }
];

// ── Local UI state (survives per-frame refreshes) ──────────────────────────
var ui = {
  groupOpen:   {},   // groupKey  -> bool
  domainOpen:  {},   // domainId  -> bool
  structureSig: null,
  layerFilter: '',   // cell layer viewer search text
  queryText: '',     // cell layer viewer query box text (page session only)
  queryRecent: [],   // last 10 run queries, newest first
  queryTimer: null,  // pending debounced query_check
  activeSlider: null // control element currently being dragged
};

var latest = {};     // last pushed domain state, keyed by display name

// ── Helpers ───────────────────────────────────────────────────────────────

// Ultralight marshals every JS string argument through Dia String64, which
// truncates at 63 characters. Keep argsJson compact and warn if it overflows.
var MAX_ARG_JSON = 63;

function sendCommand(domainId, cmd, args) {
  if (typeof app === 'undefined' || !app || !app.onCommand) return;
  var json = JSON.stringify(args || {});
  if (json.length > MAX_ARG_JSON) {
    json = '{}';
  }
  app.onCommand(String(domainId), String(cmd), json);
}

function domainsOf(data) {
  var out = [];
  for (var name in data) {
    if (!Object.prototype.hasOwnProperty.call(data, name)) continue;
    var d = data[name];
    if (!d || typeof d !== 'object') continue;
    out.push({
      id:      d._displayName || name,
      cmdId:   d._id || d._displayName || name,   // registry id: what app.onCommand / FindDomain expect (state is keyed by display name)
      group:   d._group || 'CoreDebug',
      desc:    d._description || '',
      accent:  d._accent || '',
      drawers: Array.isArray(d.drawers) ? d.drawers : [],
      stats:   (d.stats && typeof d.stats === 'object') ? d.stats : {},
      controls: Array.isArray(d.controls) ? d.controls : [],
      custom:  (typeof d.panel === 'string') ? d.panel : '',
      viewer:  isViewerState(d) ? d : null,
      history: isHistoryState(d) ? d : null,
      raw:     d
    });
  }
  out.sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
  return out;
}

// ── Cell History (DiaCellHistory F2): timeline card, not-live banner, untracked / evicted notices ──
// State from CellHistoryDomain (the typed TimelineCardState card): {available, baseLayer, banner{visible,state,layer,sample,label,
// firstRetained}, history{mode,sample,label}|null, timeline{range{first,latest,count}, position{mode,sample}, liveMarker, buckets[{first,last,
// events,colour,types}], bandTicks[{sample,band,name}], gaps{aggregate,cell,event}, preWindowDim{first,last}|null, sparkline[{first,last,value|null}]}}.
// The page only sends commands to the history domain (same executors as cells.history.*): view {sample}, live {}, step {n, band?},
// event {direction}, track {layer}. The viewer card shows the banner and notices from this state; it never computes history itself.

function isHistoryState(d) {
  return !!d && typeof d === 'object' && !!d.timeline && typeof d.timeline === 'object' && !!d.banner && typeof d.banner === 'object';
}

function histPct(n, latest) {
  if (!(latest > 0)) return 0;
  var p = Number(n) / latest * 100;
  return p < 0 ? 0 : (p > 100 ? 100 : p);
}

function histHead(hist) {
  var r = hist.timeline.range || {};
  return Number(r.latest) || 0;
}

function histHeadlineStat(hist) {
  return hist.banner.visible && hist.banner.sample !== null && hist.banner.sample !== undefined ? 'sample ' + hist.banner.sample : 'live';
}

function buildHistoryCard(domain) {
  var cmdId = domain.cmdId;
  var root = el('div', 'cl-tl is-live');
  root.setAttribute('data-role', 'history-timeline');

  var head = el('div', 'tl-head');
  head.appendChild(el('span', 'tl-title', 'TIMELINE'));
  var lay = el('span', '', 'base layer: ');
  var layName = el('span', 'tl-layer', '');
  layName.setAttribute('data-role', 'tl-layer');
  lay.appendChild(layName);
  lay.appendChild(document.createTextNode(' (world mean)'));
  head.appendChild(lay);
  var legend = el('div', 'tl-legend');
  var dens = el('span', '', 'density ');
  var densBars = el('span', 'density');
  var hs = [4, 7, 11, 15];
  for (var hi = 0; hi < hs.length; ++hi) { var bar = el('b', ''); bar.style.height = hs[hi] + 'px'; densBars.appendChild(bar); }
  dens.appendChild(densBars);
  dens.appendChild(document.createTextNode(' events/bucket'));
  legend.appendChild(dens);
  var lg = [['aggregates evicted', 'repeating-linear-gradient(135deg,#e74c3c 0 2px,transparent 2px 4px)'],
            ['events evicted', 'repeating-linear-gradient(135deg,#f5a623 0 2px,transparent 2px 4px)'],
            ['no per-cell data', '#000;border:1px solid #5a9fd4']];
  for (var li = 0; li < lg.length; ++li) {
    var item = el('span', '');
    var sw = el('i', '');
    sw.setAttribute('style', 'background:' + lg[li][1]);
    item.appendChild(sw);
    item.appendChild(document.createTextNode(lg[li][0]));
    legend.appendChild(item);
  }
  head.appendChild(legend);
  root.appendChild(head);

  var plot = el('div', 'tl-plot');
  plot.setAttribute('data-role', 'tl-plot');
  plot.setAttribute('title', 'Drag to scrub (cells.history.view)');
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'tl-spark');
  svg.setAttribute('viewBox', '0 0 1000 32');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('data-role', 'tl-spark');
  plot.appendChild(svg);
  var under = el('div', '');          // dim + gaps (rebuilt with the data)
  under.setAttribute('data-role', 'tl-under');
  plot.appendChild(under);
  var lane = el('div', 'tl-lane');
  lane.setAttribute('data-role', 'tl-lane');
  lane.appendChild(el('div', 'tl-lane-track'));
  var laneDyn = el('div', '');        // band ticks + event ticks (rebuilt with the data)
  laneDyn.setAttribute('data-role', 'tl-lane-dyn');
  lane.appendChild(laneDyn);
  plot.appendChild(lane);
  var lm = el('div', 'tl-livemark');
  lm.appendChild(el('span', '', 'LIVE head'));
  plot.appendChild(lm);
  var thumb = el('div', 'tl-thumb');
  thumb.setAttribute('data-role', 'tl-thumb');
  var tag = el('span', 'tl-thumb-tag', '');
  tag.setAttribute('data-role', 'tl-thumb-tag');
  thumb.appendChild(tag);
  plot.appendChild(thumb);
  root.appendChild(plot);

  function sampleAt(e) {
    var rect = plot.getBoundingClientRect();
    var w = rect.width || 1;
    var f = (e.clientX - rect.left) / w;
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    return Math.round(f * (root._latest || 0));
  }
  function scrubTo(e) {
    var s = sampleAt(e);
    if (root._lastSent === s) return;
    root._lastSent = s;
    sendCommand(cmdId, 'view', { sample: s });
  }
  plot.addEventListener('mousedown', function (e) { e.stopPropagation(); root._drag = true; root._lastSent = -1; scrubTo(e); });
  plot.addEventListener('mousemove', function (e) { if (root._drag) { e.stopPropagation(); scrubTo(e); } });
  var endDrag = function () { root._drag = false; };
  plot.addEventListener('mouseup', endDrag);
  plot.addEventListener('mouseleave', endDrag);
  document.addEventListener('mouseup', endDrag);

  var controls = el('div', 'tl-controls');
  var defs = [
    ['step-band-back', '⏮ −band', 'cells.history.step -band', function () { return ['step', { n: -1, band: root._topBand }]; }],
    ['step-back', '◀ −1', 'cells.history.step -1', function () { return ['step', { n: -1 }]; }],
    ['step-fwd', '+1 ▶', 'cells.history.step +1', function () { return ['step', { n: 1 }]; }],
    ['step-band-fwd', '+band ⏭', 'cells.history.step +band', function () { return ['step', { n: 1, band: root._topBand }]; }],
    null,
    ['event-prev', '◀ event', 'cells.history.event prev', function () { return ['event', { direction: 'prev' }]; }, 'ev-prev'],
    ['event-next', 'event ▶', 'cells.history.event next', function () { return ['event', { direction: 'next' }]; }, 'ev-next']
  ];
  for (var di = 0; di < defs.length; ++di) {
    if (!defs[di]) { controls.appendChild(el('span', 'tl-sep')); continue; }
    var b = el('button', 'tl-btn' + (defs[di][4] ? ' ' + defs[di][4] : ''), defs[di][1]);
    b.setAttribute('type', 'button');
    b.setAttribute('data-act', defs[di][0]);
    b.setAttribute('title', defs[di][2]);
    (function (make) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var c = make();
        if (c[1].band === undefined) delete c[1].band;
        sendCommand(cmdId, c[0], c[1]);
      });
    })(defs[di][3]);
    controls.appendChild(b);
  }
  var pos = el('span', 'tl-pos', '');
  pos.setAttribute('data-role', 'tl-pos');
  controls.appendChild(pos);
  var live = el('button', 'tl-btn live-btn', 'Back to live');
  live.setAttribute('type', 'button');
  live.setAttribute('data-act', 'live');
  live.setAttribute('title', 'cells.history.live');
  live.addEventListener('click', function (e) { e.stopPropagation(); sendCommand(cmdId, 'live', {}); });
  controls.appendChild(live);
  root.appendChild(controls);

  var info = el('div', 'tl-info', '');
  info.setAttribute('data-role', 'tl-info');
  root.appendChild(info);
  return root;
}

function histEventPx(count) { return Math.min(20, 5 + 3.5 * count); }

function renderHistoryData(root, hist) {
  var tl = hist.timeline;
  var latest = histHead(hist);
  root._latest = latest;
  var under = root.querySelector('[data-role="tl-under"]');
  var laneDyn = root.querySelector('[data-role="tl-lane-dyn"]');
  var svg = root.querySelector('[data-role="tl-spark"]');
  under.innerHTML = '';
  laneDyn.innerHTML = '';
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  var dim = tl.preWindowDim;
  if (dim && typeof dim === 'object') {
    var dw = el('div', 'tl-dim');
    dw.setAttribute('data-role', 'tl-dim');
    dw.style.width = histPct(Number(dim.last) + 1, latest) + '%';
    dw.appendChild(el('span', 'tl-dim-label', 'no per-cell data before sample ' + (Number(dim.last) + 1)));
    under.appendChild(dw);
  }
  var gaps = tl.gaps || {};
  var aggs = Array.isArray(gaps.aggregate) ? gaps.aggregate : [];
  for (var a = 0; a < aggs.length; ++a) {
    var ga = el('div', 'tl-gap');
    ga.setAttribute('data-role', 'tl-gap-aggregate');
    ga.style.left = histPct(aggs[a].first, latest) + '%';
    ga.style.width = Math.max(0.5, histPct(Number(aggs[a].last) + 1, latest) - histPct(aggs[a].first, latest)) + '%';
    under.appendChild(ga);
    if (a === 0) {
      var gl = el('div', 'tl-gap-label', 'aggregates evicted');
      gl.style.left = histPct(aggs[a].first, latest) + '%'; gl.style.top = '2px'; gl.style.color = '#e74c3c'; gl.style.marginLeft = '4px';
      under.appendChild(gl);
    }
  }
  var evg = Array.isArray(gaps.event) ? gaps.event : [];
  for (var g = 0; g < evg.length; ++g) {
    var ge = el('div', 'tl-gap events');
    ge.setAttribute('data-role', 'tl-gap-event');
    ge.style.left = histPct(evg[g].first, latest) + '%';
    ge.style.width = Math.max(0.5, histPct(Number(evg[g].last) + 1, latest) - histPct(evg[g].first, latest)) + '%';
    under.appendChild(ge);
    if (g === 0) {
      var gl2 = el('div', 'tl-gap-label', 'events evicted');
      gl2.style.left = '4px'; gl2.style.top = '42px'; gl2.style.color = '#f5a623';
      under.appendChild(gl2);
    }
  }

  var ticks = Array.isArray(tl.bandTicks) ? tl.bandTicks : [];
  var top = -1;
  for (var t = 0; t < ticks.length; ++t) if (ticks[t].band > top) top = ticks[t].band;
  root._topBand = top >= 0 ? top : undefined;
  for (var k = 0; k < ticks.length; ++k) {
    var major = ticks[k].band === top;
    var bt = el('div', 'tl-band' + (major ? ' major' : ''));
    bt.setAttribute('data-role', 'tl-band');
    bt.style.left = histPct(ticks[k].sample, latest) + '%';
    laneDyn.appendChild(bt);
    if (major && ticks[k].name) {
      var bl = el('div', 'tl-band-label major', ticks[k].name);
      bl.style.left = histPct(ticks[k].sample, latest) + '%';
      laneDyn.appendChild(bl);
    }
  }

  var buckets = Array.isArray(tl.buckets) ? tl.buckets : [];
  for (var bi = 0; bi < buckets.length; ++bi) {
    var bk = buckets[bi];
    if (!(bk.events > 0)) continue;
    var mid = (Number(bk.first) + Number(bk.last)) / 2;
    var ev = el('div', 'tl-ev');
    ev.setAttribute('data-role', 'tl-event');
    ev.style.left = histPct(mid, latest) + '%';
    ev.style.height = histEventPx(bk.events) + 'px';
    ev.style.background = viewerRgb(bk.colour);
    ev.style.opacity = String(Math.min(1, 0.45 + 0.1 * bk.events));
    ev.style.width = (bk.events >= 3 ? 3 : 2) + 'px';
    ev.setAttribute('title', bk.events + ' event' + (bk.events === 1 ? '' : 's') + ' near sample ' + Math.round(mid));
    laneDyn.appendChild(ev);
  }

  var spark = Array.isArray(tl.sparkline) ? tl.sparkline : [];
  var mn = Infinity, mx = -Infinity;
  for (var s = 0; s < spark.length; ++s) {
    if (spark[s].value === null || spark[s].value === undefined) continue;
    if (spark[s].value < mn) mn = spark[s].value;
    if (spark[s].value > mx) mx = spark[s].value;
  }
  var d = '', pen = false;
  for (var p = 0; p < spark.length; ++p) {
    var v = spark[p].value;
    if (v === null || v === undefined) { pen = false; continue; }
    var x = histPct((Number(spark[p].first) + Number(spark[p].last)) / 2, latest) * 10;
    var y = mx > mn ? 30 - (v - mn) / (mx - mn) * 28 : 16;
    d += (pen ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    pen = true;
  }
  if (d) {
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
  }

  var info = root.querySelector('[data-role="tl-info"]');
  var first = dim && typeof dim === 'object' ? Number(dim.last) + 1 : 0;
  info.textContent = 'per-cell window: sample ' + first + '–' + latest + ' · ' + buckets.length + ' buckets · sparkline: ' + spark.length + ' points';
}

function refreshHistory(card, hist) {
  var root = card.querySelector('[data-role="history-timeline"]');
  if (!root) return;
  var tl = hist.timeline;
  var latest = histHead(hist);
  var dataKey = [hist.baseLayer, tl.range && tl.range.count, tl.range && tl.range.latest, JSON.stringify(tl.gaps || {}), JSON.stringify(tl.preWindowDim || null),
                 (tl.buckets || []).length, (tl.sparkline || []).length, (tl.bandTicks || []).length].join('|');
  if (root._dataKey !== dataKey) { root._dataKey = dataKey; renderHistoryData(root, hist); }
  root._latest = latest;

  var pos = tl.position || {};
  var live = pos.mode !== 'sample';
  root.classList.toggle('is-live', live);
  var sample = live ? latest : Number(pos.sample) || 0;
  var thumb = root.querySelector('[data-role="tl-thumb"]');
  thumb.style.left = histPct(sample, latest) + '%';
  thumb.classList.toggle('flip', histPct(sample, latest) > 80);
  root.querySelector('[data-role="tl-thumb-tag"]').textContent = live ? 'LIVE ' + sample : String(sample);
  root.querySelector('[data-role="tl-layer"]').textContent = hist.baseLayer || '';
  var label = hist.banner.label ? ' · ' + hist.banner.label : '';
  var posEl = root.querySelector('[data-role="tl-pos"]');
  posEl.textContent = '';
  if (tl.range && tl.range.count > 0) {
    if (live) {
      posEl.appendChild(document.createTextNode('Following sim '));
      posEl.appendChild(el('span', 'dim', '· head = sample ' + latest + (hist.banner.label ? ' (' + hist.banner.label + ')' : '')));
    } else {
      posEl.appendChild(document.createTextNode('Sample '));
      posEl.appendChild(el('b', '', String(sample)));
      posEl.appendChild(el('span', 'dim', ' / ' + latest + label));
    }
  } else {
    posEl.appendChild(el('span', 'dim', 'No samples recorded yet'));
  }
  var bandBtns = root.querySelectorAll('[data-act="step-band-back"], [data-act="step-band-fwd"]');
  for (var i = 0; i < bandBtns.length; ++i) bandBtns[i].disabled = (root._topBand === undefined);
}

// Banner + notices on the cell-layer viewer card, driven by the history domain's state (no history domain: nothing shown).
function applyHistoryToViewer(domains) {
  var hist = null, histCmd = '';
  for (var i = 0; i < domains.length; ++i) if (domains[i].history) { hist = domains[i].history; histCmd = domains[i].cmdId; break; }
  for (var j = 0; j < domains.length; ++j) {
    if (!domains[j].viewer) continue;
    var card = document.querySelector('.domain[data-domain="' + cssEscape(domains[j].id) + '"]');
    var root = card && card.querySelector('[data-role="cell-layer-viewer"]');
    if (!root) continue;
    var banner = root.querySelector('[data-role="history-banner"]');
    var notice = root.querySelector('[data-role="history-notice"]');
    var b = hist && hist.banner;
    if (!b || !b.visible) {
      if (banner) banner.parentNode.removeChild(banner);
      if (notice) notice.parentNode.removeChild(notice);
      var stale = root.querySelector('.sample-badge');
      if (stale) stale.parentNode.removeChild(stale);
      continue;
    }
    var key = JSON.stringify([b.state, b.layer, b.sample, b.label, b.firstRetained]);
    if (!banner || banner._key !== key) {
      if (banner) banner.parentNode.removeChild(banner);
      if (notice) notice.parentNode.removeChild(notice);
      banner = el('div', 'cl-hist-banner');
      banner.setAttribute('data-role', 'history-banner');
      banner._key = key;
      var msg = el('span', '');
      msg.appendChild(document.createTextNode('Viewing sample '));
      msg.appendChild(el('b', '', String(b.sample)));
      if (b.label) {
        msg.appendChild(document.createTextNode(' ('));
        msg.appendChild(el('b', '', b.label));
        msg.appendChild(document.createTextNode(')'));
      }
      msg.appendChild(document.createTextNode(' — not live'));
      banner.appendChild(msg);
      if (b.state === 'untracked') banner.appendChild(el('span', 'vb-extra', '· ' + b.layer + ' has no per-cell history'));
      else if (b.state === 'evicted') banner.appendChild(el('span', 'vb-extra', '· per-cell data evicted'));
      var lb = el('button', 'live-btn', 'Back to live');
      lb.setAttribute('type', 'button');
      lb.setAttribute('data-act', 'live');
      lb.addEventListener('click', function (e) { e.stopPropagation(); sendCommand(histCmd, 'live', {}); });
      banner.appendChild(lb);
      root.insertBefore(banner, root.firstChild);

      if (b.state === 'untracked' || b.state === 'evicted') {
        notice = el('div', 'cl-hist-notice ' + b.state);
        notice.setAttribute('data-role', 'history-notice');
        if (b.state === 'untracked') {
          notice.appendChild(el('h4', '', 'No per-cell history for ' + b.layer));
          notice.appendChild(document.createTextNode(b.layer + ' is not tracked, so there is no per-cell data for sample ' + b.sample +
            '. Live values are never shown while scrubbed. World aggregates are still on the timeline.'));
          notice.appendChild(document.createElement('br'));
          var tb = el('button', 'track-btn', 'Track this layer');
          tb.setAttribute('type', 'button');
          tb.setAttribute('data-act', 'track');
          tb.addEventListener('click', function (e) { e.stopPropagation(); sendCommand(histCmd, 'track', { layer: b.layer }); });
          notice.appendChild(tb);
          notice.appendChild(el('div', 'runs', 'runs: cells.history.track ' + b.layer));
        } else {
          notice.appendChild(el('h4', '', 'Per-cell data evicted'));
          notice.appendChild(document.createTextNode('Sample ' + b.sample + (b.label ? ' (' + b.label + ')' : '') +
            ' is older than the per-cell window, which now starts at sample ' + b.firstRetained +
            '. Aggregates and events for this sample may still exist on the timeline.'));
        }
        banner.parentNode.insertBefore(notice, banner.nextSibling);
      }
    }
    var hover = root.querySelector('[data-role="hover"]');
    var badge = hover && hover.querySelector('.sample-badge');
    if (hover && hover.firstChild && !badge) {
      badge = el('span', 'sample-badge', '');
      badge.setAttribute('data-role', 'sample-badge');
      hover.insertBefore(badge, hover.firstChild);
    }
    if (badge) badge.textContent = 'sample ' + b.sample;
  }
}

// A cell-layer viewer state (DiaCellLayers CellLayerViewerDomain) is recognised by shape.
function isViewerState(d) {
  return Array.isArray(d.layers) && Array.isArray(d.overlays) && typeof d.activeBase === 'string';
}

function isDomainEnabled(domain) {
  if (domain.viewer || domain.history) return true;   // overlays are its drawers; the card is not "off" when none are on
  for (var i = 0; i < domain.drawers.length; ++i) {
    if (domain.drawers[i] && domain.drawers[i].enabled) return true;
  }
  return false;
}

function headlineStat(domain) {
  if (domain.history) return histHeadlineStat(domain.history);
  if (domain.viewer) return domain.viewer.empty ? 'no layers' : 'base: ' + domain.viewer.activeBase;
  for (var k in domain.stats) {
    if (!Object.prototype.hasOwnProperty.call(domain.stats, k)) continue;
    var v = domain.stats[k];
    if (v === null || typeof v === 'object' || Array.isArray(v)) continue;
    return k + ': ' + formatStatValue(v);
  }
  return '';
}

function formatStatValue(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') return '';
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'number') {
    if (!isFinite(v)) return String(v);
    if (Math.floor(v) === v) return String(v);
    var s = v.toFixed(3);
    return s.replace(/\.?0+$/, '') || '0';
  }
  return String(v);
}

function renderArrayTable(arr) {
  if (!arr || arr.length === 0) return '';
  var cols = [];
  var first = arr[0];
  for (var ck in first)
    if (Object.prototype.hasOwnProperty.call(first, ck)) cols.push(ck);
  if (cols.length === 0) return '';
  var html = '<div class="st-table"><div class="st-hdr">';
  for (var ci = 0; ci < cols.length; ++ci)
    html += '<span class="st-cell">' + escapeHtml(cols[ci]) + '</span>';
  html += '</div>';
  for (var ri = 0; ri < arr.length; ++ri) {
    html += '<div class="st-row">';
    for (var ci2 = 0; ci2 < cols.length; ++ci2) {
      var cv = arr[ri][cols[ci2]];
      html += '<span class="st-cell">' + escapeHtml(cv !== null && typeof cv === 'object' ? '' : formatStatValue(cv)) + '</span>';
    }
    html += '</div>';
  }
  return html + '</div>';
}

// Structure signature — a rebuild only happens when the domain/drawer/control
// inventory changes, so accordion state and slider drags are never clobbered.
function structureSignature(domains) {
  var parts = [];
  for (var i = 0; i < domains.length; ++i) {
    var d = domains[i];
    var drawers = d.drawers.map(function (x) { return x && x.name ? x.name : '?'; }).join(',');
    var ctrls   = d.controls.map(function (c) {
      if (!c) return '?';
      var id = controlId(c) || '?';
      return c.schemaKey ? id + '@' + c.schemaKey + (c.packId ? '#' + c.packId : '') : id;
    }).join(',');
    parts.push(d.group + '/' + d.id + '@' + d.cmdId + '[' + drawers + '][' + ctrls + ']' + d.custom + (d.viewer ? viewerSignature(d.viewer) : ''));
  }
  return parts.join('|') + '~' + vs.gen;
}

// ── Build (structure changed) ─────────────────────────────────────────────

function rebuild(domains) {
  vtClose();
  var list = document.getElementById('groups-list');
  list.innerHTML = '';

  if (domains.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.id = 'empty-state';
    empty.textContent = 'No domains registered';
    list.appendChild(empty);
    return;
  }

  for (var g = 0; g < GROUP_ORDER.length; ++g) {
    var groupDef = GROUP_ORDER[g];
    var members = domains.filter(function (d) { return d.group === groupDef.key; });
    if (members.length === 0) continue;

    if (!(groupDef.key in ui.groupOpen)) ui.groupOpen[groupDef.key] = true;

    var group = document.createElement('div');
    group.className = 'group ' + (ui.groupOpen[groupDef.key] ? 'open' : 'closed');
    group.setAttribute('data-g', groupDef.css);
    group.setAttribute('data-group-key', groupDef.key);
    if (members[0].accent) group.style.setProperty('--accent', members[0].accent);

    var hdr = document.createElement('div');
    hdr.className = 'group-hdr';
    hdr.appendChild(el('span', 'group-arrow'));
    hdr.appendChild(el('span', 'group-label', groupDef.label));
    var meta = el('span', 'group-meta', members.length + (members.length === 1 ? ' domain' : ' domains'));
    hdr.appendChild(meta);

    var allOn = document.createElement('button');
    allOn.className = 'btn-all on';
    allOn.textContent = 'All On';
    var allOff = document.createElement('button');
    allOff.className = 'btn-all off';
    allOff.textContent = 'All Off';
    hdr.appendChild(allOn);
    hdr.appendChild(allOff);

    (function (groupKey, groupEl) {
      hdr.addEventListener('click', function () {
        ui.groupOpen[groupKey] = !ui.groupOpen[groupKey];
        groupEl.classList.toggle('open',   ui.groupOpen[groupKey]);
        groupEl.classList.toggle('closed', !ui.groupOpen[groupKey]);
      });
      allOn.addEventListener('click', function (e) { e.stopPropagation(); setGroupAll(groupKey, true); });
      allOff.addEventListener('click', function (e) { e.stopPropagation(); setGroupAll(groupKey, false); });
    })(groupDef.key, group);

    group.appendChild(hdr);

    var body = el('div', 'group-body');
    for (var m = 0; m < members.length; ++m) {
      body.appendChild(buildDomainCard(members[m]));
    }
    group.appendChild(body);

    list.appendChild(group);
  }
  if (currentFilter) applyFilter(currentFilter);
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildDomainCard(domain) {
  if (!(domain.id in ui.domainOpen)) ui.domainOpen[domain.id] = (domain.custom === 'f2_test_runner') || !!domain.viewer || !!domain.history;

  var enabled = isDomainEnabled(domain);

  var card = document.createElement('div');
  card.className = 'domain ' + (domain.custom === 'f2_test_runner' ? 'f2card ' : '') + (enabled ? 'enabled ' : 'disabled ') +
                   (ui.domainOpen[domain.id] ? 'open' : 'closed');
  card.setAttribute('data-domain', domain.id);
  if (domain.accent) card.style.setProperty('--accent', domain.accent);

  // Header
  var hdr = el('div', 'domain-hdr');
  var tog = el('div', 'tog ' + (enabled ? 'on' : 'off'));
  tog.setAttribute('data-role', 'domain-toggle');
  hdr.appendChild(tog);
  hdr.appendChild(el('span', 'domain-name', domain.id));
  var stat = el('span', 'domain-stat', headlineStat(domain));
  stat.setAttribute('data-role', 'headline');
  hdr.appendChild(stat);
  hdr.appendChild(el('span', 'expand-btn'));

  hdr.addEventListener('click', function () {
    ui.domainOpen[domain.id] = !ui.domainOpen[domain.id];
    card.classList.toggle('open',   ui.domainOpen[domain.id]);
    card.classList.toggle('closed', !ui.domainOpen[domain.id]);
  });
  tog.addEventListener('click', function (e) {
    e.stopPropagation();
    setDomainAll(domain.id, !tog.classList.contains('on'));
  });
  card.appendChild(hdr);

  // Body
  var body = el('div', 'domain-body');
  if (domain.desc) body.appendChild(el('div', 'desc', domain.desc));

  if (domain.custom === 'f2_test_runner') {
    body.appendChild(buildF2Panel(domain));
    card.appendChild(body);
    return card;
  }

  if (domain.viewer) body.appendChild(buildViewer(domain));
  if (domain.history) body.appendChild(buildHistoryCard(domain));

  var drawers = el('div', 'drawers');
  for (var i = 0; !domain.viewer && !domain.history && i < domain.drawers.length; ++i) {   // viewer overlays render as checkboxes below
    var dw = domain.drawers[i];
    if (!dw || !dw.name) continue;
    var row = el('div', 'dr ' + (dw.enabled ? 'on' : 'off'));
    row.setAttribute('data-drawer', dw.name);
    row.appendChild(el('span', 'dr-box'));
    row.appendChild(document.createTextNode(' ' + dw.name));
    (function (name) {
      row.addEventListener('click', function (e) {
        e.stopPropagation();
        sendCommand(domain.cmdId, 'toggle', { drawer: name });
      });
    })(dw.name);
    drawers.appendChild(row);
  }
  body.appendChild(drawers);

  var stats = el('div', 'stats');
  stats.setAttribute('data-role', 'stats');
  body.appendChild(stats);

  var controls = el('div', 'controls');
  for (var c = 0; c < domain.controls.length; ++c) {
    var ctrlDef = domain.controls[c];
    if (!ctrlDef || !controlId(ctrlDef) || !isSliderControl(ctrlDef)) continue;
    controls.appendChild(buildControl(domain.cmdId, ctrlDef));
  }
  body.appendChild(controls);

  card.appendChild(body);
  return card;
}

// A control is identified by `key` (legacy providers) or `name` (SchemaControl providers).
// Only slider controls (the default when `type` is absent) are rendered today.
function controlId(def) { return (def && (def.key || def.name)) || ''; }
function isSliderControl(def) { return !def.type || def.type === 'slider'; }

function buildControl(domainId, def) {
  var rc = resolveControl(def);
  var ctrl = el('div', 'ctrl');
  ctrl.setAttribute('data-control', rc.id);
  if (typeof def.schemaKey === 'string') ctrl.setAttribute('data-schema-key', def.schemaKey);
  if (rc.decimals !== null) ctrl.setAttribute('data-decimals', String(rc.decimals));

  ctrl.appendChild(el('span', 'ctrl-label', rc.label));
  if (rc.entry) ctrl.appendChild(vtBuildIcon(rc, def));

  var track = el('div', 'track');
  var range = document.createElement('input');
  range.type  = 'range';
  range.min   = rc.min;
  range.max   = rc.max;
  range.step  = rc.step;
  range.value = (def.value !== undefined) ? def.value : 0;
  track.appendChild(range);

  if (rc.hasDefault && rc.max > rc.min) {
    var frac = (rc.defaultValue - rc.min) / (rc.max - rc.min);
    frac = Math.max(0, Math.min(1, frac));
    var tick = el('div', 'dtick');
    tick.setAttribute('data-role', 'default-tick');
    tick.style.left = (frac * 100) + '%';
    track.appendChild(tick);
  }

  var display = el('span', 'cv', formatValue(range.value, rc.decimals));

  range.addEventListener('input', function () {
    ui.activeSlider = range;
    display.textContent = formatValue(range.value, rc.decimals);
  });
  range.addEventListener('change', function () {
    ui.activeSlider = null;
    display.textContent = formatValue(range.value, rc.decimals);
    sendCommand(domainId, 'setScale', { key: rc.id, value: parseFloat(range.value) });
  });

  ctrl.appendChild(track);
  ctrl.appendChild(display);
  if (rc.entry && def.packId) {
    var pm = el('span', 'pack-marker', 'pack: ' + def.packId);
    pm.setAttribute('data-role', 'pack-marker');
    ctrl.appendChild(pm);
  }
  return ctrl;
}

// `decimals` (optional, from control or schema ui.decimals) fixes the displayed precision.
function formatValue(v, decimals) {
  var n = parseFloat(v);
  if (!isFinite(n)) return String(v);
  if (decimals !== undefined && decimals !== null) return n.toFixed(decimals);
  return (Math.abs(n) >= 10 || n === Math.floor(n)) ? String(n) : n.toFixed(2);
}

// ── F-2 TestRunnerPanel ───────────────────────────────────────────────────

function refreshF2Panel(card, st) {
  var q = function (role) { return card.querySelector('[data-role="' + role + '"]'); };
  var set = function (node, html) { if (node && node.innerHTML !== html) node.innerHTML = html; };
  if (!st || !Array.isArray(st.phases) || !Array.isArray(st.checks) || !Array.isArray(st.fingerprints)) return;

  var run = q('f2-run');
  if (run) { run.textContent = st.runLabel; run.disabled = !st.runEnabled; }

  var strip = '';
  for (var i = 0; i < st.phases.length; ++i) {
    var p = st.phases[i];
    var cls = 'f2-ph' + (p.failed ? ' bad' : (p.current ? ' cur' : (p.done ? ' done' : '')));
    strip += '<div class="' + cls + '">' + escapeHtml(p.name) + '</div>';
  }
  set(q('f2-strip'), strip);
  set(q('f2-tick'), escapeHtml(st.tickText));

  var rows = '';
  for (var c = 0; c < st.checks.length; ++c) {
    var k = st.checks[c];
    rows += '<tr><td>' + escapeHtml(k.id) + '</td><td>' + escapeHtml(k.name) + '</td><td><span class="f2-st ' +
            escapeHtml(k.status) + '">' + escapeHtml(k.status) + '</span></td><td>' + escapeHtml(k.result) + '</td></tr>';
  }
  set(q('f2-checks'), rows);

  var fp = '', anyShown = false;
  for (var f = 0; f < st.fingerprints.length; ++f) {
    var r = st.fingerprints[f];
    var val;
    if (r.state === 'pending') val = '<span class="dim">pending</span>';
    else if (r.state === 'none') val = '<span class="dim">-</span>';
    else if (r.state === 'diff') val = '<span class="diff">' + escapeHtml(r.diffFields.join(', ')) + '</span>';
    else val = '<span class="ok">' + escapeHtml(f2Dot(r.text)) + '</span>';
    if (r.state !== 'none') anyShown = true;
    fp += '<div class="f2-fp"><span class="k">' + escapeHtml(r.label) + '</span>' + val + '</div>';
  }
  if (!anyShown) fp = '<div class="f2-fp"><span class="dim">Captured during the run.</span></div>';
  set(q('f2-fp'), fp);

  var clock = q('f2-clock');
  if (clock) clock.textContent = f2Dot(st.clockText);
  var btns = card.querySelectorAll('button[data-m]');
  for (var b = 0; b < btns.length; ++b) {
    btns[b].disabled = !st.controlsEnabled;
    var tier = btns[b].getAttribute('data-tier');
    if (tier !== null) btns[b].classList.toggle('sel', parseInt(tier, 10) === st.speedTier);
  }
  var foot = q('f2-foot');
  if (foot) foot.textContent = st.footer;
}

// ── Cell layer viewer card (DiaCellLayers) ────────────────────────────────
// State from CellLayerViewerDomain: empty, noData, activeBase, layers[{id,label,unit,kind,hotkey,selected,group,
// groupNumber,description?}], groups[{name,layers[ids]}], overlays[{id,label,enabled}], grids[], gridSelector[] (multi-grid only),
// legend{available,category,ramp,stops,ticks,unit,seen,swatches}, hover{valid,q,r,label,description,unit,text}.
// selection{count,tool,group,groups[{id,label,selected}],tooLarge,tooLargeText?}. The page only sends commands (base {id}, grid {index}, toggle {drawer},
// select_tool {tool}, select_group {layer}, select_clear {}, select_pin {freeze?}, select_unpin {}, inspector_expand {group, expanded}); the domain owns all state.
// inspector{...}: the Selection Inspector card (see renderInspector). Commands are
// addressed by the domain's registry id (domain.cmdId, from the state's _id; the card is keyed by display name).
// Layout/classes follow docs/specs/applications/dia/systems/diacelllayers/mockups/cell-layer-viewer.html.

function viewerSignature(v) {
  var parts = [v.empty ? 'E' : 'F'];
  for (var i = 0; i < v.layers.length; ++i) {
    var l = v.layers[i];
    parts.push([l.id, l.label, l.group, l.groupNumber, l.hotkey, l.description || ''].join(','));
  }
  for (var o = 0; o < v.overlays.length; ++o) parts.push('o:' + v.overlays[o].id + ',' + v.overlays[o].label);
  if (Array.isArray(v.gridSelector)) {
    for (var g = 0; g < v.gridSelector.length; ++g) {
      var gs = v.gridSelector[g];
      parts.push('g:' + gs.index + ',' + gs.width + ',' + gs.height + ',' + gs.layerCount);
    }
  }
  if (v.selection && Array.isArray(v.selection.groups)) {
    for (var sg = 0; sg < v.selection.groups.length; ++sg) parts.push('s:' + v.selection.groups[sg].id + ',' + v.selection.groups[sg].label);
  }
  return '{' + parts.join(';') + '}';
}

function viewerRgb(rgba8) {
  var n = Number(rgba8) >>> 0;   // 0xRRGGBBAA
  return 'rgb(' + ((n >>> 24) & 255) + ', ' + ((n >>> 16) & 255) + ', ' + ((n >>> 8) & 255) + ')';
}

function refreshSelection(root, s) {
  var sec = root.querySelector('[data-role="selection"]') || root;
  if (!s) return;
  var n = Number(s.count) || 0;

  for (var i = 0; i < btns.length; ++i) btns[i].classList.toggle('active', btns[i].getAttribute('data-tool') === s.tool);
  var select = sec.querySelector('[data-role="selection-group"] select');
  if (select && select.value !== s.group && document.activeElement !== select) select.value = s.group;
  var banner = sec.querySelector('[data-role="selection-banner"]');
