<html>
    <head>
    <link rel="stylesheet" href="../Webix/5.2.1/webix.css" type="text/css">
    <script src="../Webix/5.2.1/webix.js" type="text/javascript"></script>
    <style>
        .badge-passed { color: #4CAF50; font-weight: bold; }
        .badge-failed { color: #F44336; font-weight: bold; }
        .badge-timeout { color: #FF9800; font-weight: bold; }
        .badge-running { color: #2196F3; font-weight: bold; }
        .badge-none { color: #9E9E9E; }
    </style>
    </head>
    <body>
        <div id="bootscreen"></div>
        <script type="text/javascript">
            var launch_unique_name = "";

            function buildStageList() {
                var launch_menu_data = [];
                var stageCount = app.Application_GetStageCount();
                for (var i = 0; i < stageCount; i++) {
                    var name = app.Application_GetStageName(i);
                    var status = app.Application_GetStageStatus(i);
                    var badge = "";
                    var badgeClass = "badge-none";
                    if (status === "passed") { badge = "&#10003;"; badgeClass = "badge-passed"; }
                    else if (status === "failed") { badge = "&#10007;"; badgeClass = "badge-failed"; }
                    else if (status === "timeout") { badge = "&#10007;"; badgeClass = "badge-timeout"; }
                    else if (status === "running") { badge = "&#9679;"; badgeClass = "badge-running"; }
                    else { badge = "&mdash;"; }

                    launch_menu_data.push({
                        id: i + 1,
                        title: name,
                        unique_name: name,
                        badge: badge,
                        badgeClass: badgeClass
                    });
                }

                webix.ui(
                    {
                        view: "window",
                        id: "mylist",
                        head:"CluicheTest — Select Stage",
                        position: "center",
                        body:
                        {
                            type:"line",
                            rows:
                            [
                                {
                                    view: "list",
                                    data: launch_menu_data,
                                    template: "<span class='#badgeClass#'>#badge#</span> <strong>#title#</strong>",
                                    select: true,
                                    scroll: false,
                                    autoheight: true,
                                    autowidth: true,
                                    on: {
                                        'onAfterSelect': function (id) {
                                            launch_unique_name = this.getItem(id).unique_name;
                                        }
                                    }
                                },
                                {
                                    view: "toolbar", elements:
                                    [
                                        { view:"button", value:"Launch", click:"launch_level"}
                                    ]
                                }
                            ]
                        }
                    }
                ).show();
            }

            function launch_level() {
                app.Application_LaunchLevel(launch_unique_name);
            }

            setTimeout(buildStageList, 0);
        </script>
    </body>
</html>
