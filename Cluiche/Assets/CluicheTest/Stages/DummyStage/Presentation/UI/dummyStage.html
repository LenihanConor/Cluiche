<html>
    <head>
        <title>DummyStage</title>
        <style>
            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: transparent;
                font-family: Segoe UI, Arial, sans-serif;
            }
            body {
                display: -webkit-box;
                -webkit-box-pack: center;
                -webkit-box-align: center;
            }
            .panel {
                min-width: 260px;
                padding: 20px 28px;
                text-align: center;
                color: #e8eaed;
                background: rgba(24, 26, 31, 0.92);
                border: 1px solid #3c4048;
                border-radius: 8px;
            }
            .panel h1 {
                margin: 0 0 6px 0;
                font-size: 18px;
                font-weight: 600;
            }
            .panel p {
                margin: 0 0 18px 0;
                font-size: 13px;
                color: #9aa0a6;
            }
            .panel button {
                padding: 8px 22px;
                font-size: 14px;
                color: #fff;
                background: #3b82f6;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .panel button:hover {
                background: #2563eb;
            }
        </style>
    </head>
    <body>
        <div class="panel">
            <h1>DummyStage</h1>
            <p>Nothing to do here!</p>
            <button onclick="app.Application_ExitLevel()">Exit Level</button>
        </div>
    </body>
</html>
