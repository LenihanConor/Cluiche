<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mockup: Navigate Failed Dialog</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      display: flex;
      align-items: center; justify-content: center;
    }
    .modal {
      background: #2d2d2d; border: 1px solid #555;
      border-radius: 4px; padding: 16px; min-width: 300px; max-width: 480px;
    }
    .modal h3 { font-size: 13px; color: #f0a030; margin-bottom: 10px; }
    .modal p { font-size: 12px; color: #9d9d9d; margin-bottom: 14px; line-height: 1.5; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-footer button {
      background: #3c3c3c; color: #d4d4d4;
      border: 1px solid #555; padding: 4px 12px;
      font-size: 12px; cursor: pointer; border-radius: 2px;
    }
    .modal-footer button:hover { background: #4c4c4c; }
    .modal-footer .btn-danger { background: #6b2020; border-color: #a02020; color: #f48771; }
    .modal-footer .btn-danger:hover { background: #8b2020; }
    .modal-footer .btn-add-confirm { background: #0078d4; color: #fff; border: none; }
    .modal-footer .btn-add-confirm:hover { background: #106ebe; }
    code { background: #1e1e1e; padding: 1px 4px; border-radius: 3px; font-size: 11px; color: #e0c080; }
    .path-code { font-size: 10px; color: #888; }
    .create-path { font-size: 10px; color: #9cdcfe; }
  </style>
</head>
<body>

      <span style="color:#9d9d9d">Error:</span> could not open file<br><br>
      Would you like to create the missing file at:<br>
      <code class="create-path">C:\GitHub\Cluiche\Cluiche\Assets\CluicheTest\Global\Scene/more.diaentitytemplate</code>

</html>
