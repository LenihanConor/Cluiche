<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Debug Layers</title>
  <style>
    /* layout only — no colors/fonts */
    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      padding: 14px 16px;
      box-sizing: border-box;
    }
    .panel-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .panel-header h1 { flex: 1; margin: 0; }
    .layer-list-wrap { flex: 1; overflow: auto; }
    .layer-item {
      display: flex;
      align-items: center;
      padding: 5px 0;
    }
    .layer-item input[type="checkbox"] { margin-right: 8px; cursor: pointer; }
    .layer-name { flex: 1; font-family: var(--pico-font-family-monospace, monospace); }
    .layer-priority { min-width: 28px; text-align: right; }
    /* visibility toggled by JS via className */
    .badge { display: none; }
    .badge.visible { display: inline-block; }
    .overflow-banner { display: none; margin-bottom: 10px; }
    .overflow-banner.visible { display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <h1>Debug Layers</h1>
      <mark id="drop-badge" class="badge">0 dropped</mark>
    </div>

    <div id="overflow-banner" class="overflow-banner" role="alert" style="display:none">
      Primitive budget exceeded — some draw calls were dropped this frame.
    </div>

    <div class="layer-list-wrap">
      <p id="empty-msg"><em>No layers registered.</em></p>
      <ul id="layer-list" class="layer-list" style="display:none; list-style:none; margin:0; padding:0;"></ul>
    </div>
  </div>

  <script src="debug-layers.js"></script>
</body>
</html>
